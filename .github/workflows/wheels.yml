name: wheels

# Build redistributable wheels containing the momwire._accelerators C++ extension
# for modern Linux (manylinux_2_28, libmvec path), Windows (MSVC, /openmp:llvm +
# /arch:AVX2), and macOS Apple Silicon (arm64, Homebrew libomp + NEON
# autovectorization). cibuildwheel handles the per-Python matrix, the manylinux
# container, and wheel repair (auditwheel on Linux, delvewheel on Windows,
# delocate on macOS).
#
# Triggers (deliberately NOT pull_request — the 4-8 min cross-platform matrix
# must never block PR feedback):
#   - push to main: post-merge validation, so main always builds clean wheels
#     on both platforms. The fast Linux-compile smoke already runs per-PR in
#     ci.yml's `test` job (`pip install -e .` builds the extension), so the only
#     gap this leaves is Windows/MSVC-specific breakage, caught here on merge.
#   - push tags v*: build + attach the wheels (+ sdist) to the GitHub Release,
#     and publish them to PyPI via Trusted Publishing.
#   - workflow_dispatch: run the full matrix manually on a branch before merging
#     a build-affecting change, when you want cross-platform coverage pre-merge.

on:
  workflow_dispatch:
    inputs:
      pynec_find_links:
        description: >-
          --find-links URL for the pynec-accel release the cross-engine jobs
          (macOS/Linux/Windows) validate against. On macOS use a build that
          excludes libomp (shares Homebrew's), otherwise that leg is expected
          to abort/deadlock. The default is the current shared-libomp release;
          v1.7.4-accel.5 and older vendor libomp and abort (#229).
        required: false
        default: "https://github.com/stevenmburns/python-necpp/releases/expanded_assets/v1.7.6"
  push:
    branches: ["main"]
    tags: ["v*"]

# Superseded MAIN-push matrices cancel; tag refs are unique groups, so a
# release build can never be cancelled (#220). Back-to-back merges used to
# stack full 12-minute Windows matrices.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the native Apple Silicon (arm64) runner. Intel macOS is
        # intentionally out of scope for this first cut.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
        # The extension builds from src/momwire only — no external sources. (The
        # PyNEC backend tests, which need a separately-installed PyNEC wheel,
        # are excluded from the wheel test-command.)
      - name: Install libomp (macOS OpenMP runtime)
        # Apple clang has no bundled OpenMP runtime; setup.py's darwin branch
        # links Homebrew's libomp (LIBOMP_PREFIX). The wheel does NOT vendor it
        # (delocate --exclude libomp) so it can share one libomp with pynec-accel
        # — so libomp is needed here at build AND by users at runtime. No-op on
        # the other runners.
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Assert the tag matches pyproject's version (tags only)
        # The release runbook warns "tagging first mislabels every wheel";
        # make it structural (#220): a v-tag whose commit still carries the
        # previous version dies here, before 15 wheels are built from it.
        # bash shell explicitly, so the ${TAG#v} strip works on Windows too.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -Fxq "version = \"${TAG#v}\"" pyproject.toml || {
            echo "pyproject.toml version does not match tag ${TAG}"; exit 1; }
      - name: Build wheels (full matrix — tags and manual runs)
        # Tags build the full cp310–cp314 matrix from pyproject's
        # [tool.cibuildwheel].build. Two steps rather than a conditional
        # CIBW_BUILD env: an empty env value would OVERRIDE pyproject's
        # build spec instead of falling back to it.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: pypa/cibuildwheel@v4.1.1
      - name: Build wheels (single-Python canary — main pushes)
        # Post-merge compiler canary (all 3 red runs in 30 days were MSVC),
        # not a release: one Python per OS is enough signal at ~1/5 the
        # work (#220).
        if: "!(startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')"
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD: "cp312-*"
      - name: Assert libomp is NOT vendored into the macOS wheel
        # Regression guard for the `delocate --exclude libomp` above: if a future
        # change drops the exclude, the wheel would bundle a private libomp again
        # and reintroduce the duplicate-OpenMP-runtime abort/deadlock when loaded
        # alongside pynec-accel. cibuildwheel's own test-command already proves
        # the wheel still LOADS against Homebrew's libomp on this runner.
        if: runner.os == 'macOS'
        run: |
          for whl in wheelhouse/*.whl; do
            if unzip -l "$whl" | grep -qi 'libomp.*\.dylib'; then
              echo "ERROR: $whl bundles libomp — the --exclude regressed."; exit 1
            fi
          done
          echo "OK: no libomp vendored in the macOS wheels."
      - name: Assert libgomp is NOT vendored into the Linux wheel
        # Regression guard for `auditwheel --exclude libgomp.so.1`: a private
        # vendored libgomp (momwire.libs/libgomp-<hash>.so) reintroduces the
        # static-TLS clash with pynec-accel (each ends up with its own OpenMP
        # runtime). cibuildwheel's test-command already proves the wheel LOADS
        # against the runner's system libgomp.
        if: runner.os == 'Linux'
        run: |
          for whl in wheelhouse/*.whl; do
            if unzip -l "$whl" | grep -qi 'libgomp'; then
              echo "ERROR: $whl bundles libgomp — the --exclude regressed."; exit 1
            fi
          done
          echo "OK: no libgomp vendored in the Linux wheels."
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  macos_cross_engine:
    # Validate the shared-libomp fix on real macOS hardware against the REAL
    # built wheel: run the PyNEC cross-validation suite with momwire + PyNEC in
    # one process and NO workaround env vars (no KMP_DUPLICATE_LIB_OK, no
    # OMP_NUM_THREADS). It passes only when both extensions load a SINGLE
    # libomp — Homebrew's, since neither wheel vendors one (momwire via
    # `delocate --exclude libomp`, pynec-accel since v1.7.6). Pointing the
    # input at a pre-1.7.6 build (vendored libomp) reproduces the abort (OMP
    # Error #15) or deadlock instead (#229); a momwire wheel that re-vendored
    # libomp would fail the same way, which is why this installs the wheelhouse
    # wheel rather than building from source (a source build links Homebrew's
    # libomp directly and can never show a wheel-vendoring bug). Manual-only
    # (workflow_dispatch), never on push, and time-boxed so a deadlock fails
    # fast instead of hanging.
    name: macOS cross-engine (PyNEC + momwire wheel, shared libomp)
    if: github.event_name == 'workflow_dispatch'
    needs: build_wheels
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The de-vendored wheel expects Homebrew's libomp at runtime.
      - run: brew install libomp
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos-14
          path: wheelhouse
      - run: pip install --upgrade pip
      # Install the BUILT momwire wheel (NOT source) + the test deps.
      - run: pip install wheelhouse/momwire-*-cp312-cp312-macosx_*_arm64.whl pytest pytest-xdist matplotlib scikit-rf
      - name: Install pynec-accel (the build under test)
        # Distribution is `pynec-accel` (import name stays PyNEC); --no-index
        # pins the wheel to the release under test.
        run: pip install pynec-accel --no-index --find-links "${{ inputs.pynec_find_links }}"
      - name: Assert both wheels share Homebrew's libomp
        # No KMP_DUPLICATE_LIB_OK / OMP_NUM_THREADS here on purpose. A green run =
        # one shared libomp; an abort/timeout = two copies (a vendored libomp on
        # either side).
        run: |
          python -c "import momwire; assert momwire.accelerated, 'momwire accelerator did not load (libomp?)'"
          pytest tests/test_pynec_backend.py -v

  windows_cross_engine:
    # Same one-process pairing on Windows, against the real built wheel. Today
    # the two extensions use DIFFERENT OpenMP runtimes — momwire vendors LLVM's
    # libomp140 (MSVC /openmp:llvm + delvewheel), pynec-accel vendors MSVC's
    # classic vcomp140 — so the macOS-style duplicate-libomp abort cannot fire
    # (OMP Error #15 only detects two copies of the SAME KMP-family runtime) and
    # coexistence costs at worst two independent thread pools. This job guards
    # the day that stops being true: if either side switches runtime families
    # (e.g. pynec-accel moving to /openmp:llvm) both processes would carry
    # private libomp copies and the duplicate-runtime abort returns — delvewheel
    # name-mangling does NOT prevent it, the runtime detects duplicates by
    # registration, not filename. Manual + needs the wheels, like the other legs.
    name: Windows cross-engine (PyNEC + momwire wheel, distinct OpenMP runtimes)
    if: github.event_name == 'workflow_dispatch'
    needs: build_wheels
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-latest
          path: wheelhouse
      # python -m pip: on Windows pip.exe refuses to replace itself in-place.
      - run: python -m pip install --upgrade pip
      # Install the BUILT momwire wheel (NOT source) + the test deps. bash shell
      # so the wheel glob expands (pwsh would pass it through literally).
      - shell: bash
        run: pip install wheelhouse/momwire-*-cp312-cp312-win_amd64.whl pytest pytest-xdist matplotlib scikit-rf
      - name: Install pynec-accel (the build under test)
        run: pip install pynec-accel --no-index --find-links "${{ inputs.pynec_find_links }}"
      - name: Assert both accelerated extensions coexist in one process
        # No KMP_DUPLICATE_LIB_OK here on purpose: it must stay unnecessary.
        shell: bash
        run: |
          python -c "import momwire; assert momwire.accelerated, 'momwire accelerator did not load (libomp140?)'"
          pytest tests/test_pynec_backend.py -v

  linux_cross_engine:
    # Validate the shared-libgomp fix against the REAL built wheel — the case
    # that actually regressed. (CI's test-pynec builds momwire from *source*,
    # which links the system OpenMP runtime directly and so can never show a
    # wheel-vendoring bug. Only the auditwheel-repaired wheel vendors/de-vendors
    # libgomp.) This installs the wheelhouse momwire
    # wheel + pynec-accel and runs the PyNEC cross-validation with NO
    # GLIBC_TUNABLES: green only when momwire's wheel shares the system libgomp
    # (the --exclude took effect); a re-vendored private libgomp would fail with
    # "cannot allocate memory in static TLS block". Manual + needs the wheels.
    name: Linux cross-engine (PyNEC + momwire wheel, shared libgomp)
    if: github.event_name == 'workflow_dispatch'
    needs: build_wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The de-vendored wheel links the system libgomp at runtime.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      - run: pip install --upgrade pip
      # Install the BUILT momwire wheel (NOT source) + the test deps.
      - run: pip install wheelhouse/momwire-*-cp312-cp312-*manylinux*_x86_64.whl pytest pytest-xdist matplotlib scikit-rf
      - name: Install pynec-accel (the build under test)
        run: pip install pynec-accel --no-index --find-links "${{ inputs.pynec_find_links }}"
      - name: Assert the wheel's accelerator loads against the shared system libgomp
        run: |
          python -c "import momwire; assert momwire.accelerated, 'momwire accelerator did not load — vendored-libgomp static-TLS clash?'"
          pytest tests/test_pynec_backend.py -v

  make_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        run: pipx run build --sdist
      - name: Verify the sdist builds the extension from source
        # Compiling the extension from the sdist on a clean checkout is what
        # catches a missing build input (e.g. the inline header that setuptools
        # does not auto-include — see MANIFEST.in). ubuntu-latest's glibc ships
        # libmvec, so the Linux build path here matches the wheels.
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.tar.gz
          python -c "import momwire._accelerators; from momwire import bspline as b; assert b._HAVE_BSPLINE_ASSEMBLE_ACCEL and b._HAVE_BSPLINE_SWEPT_ASSEMBLE_ACCEL"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

  release:
    name: attach wheels + sdist to release
    needs: [build_wheels, make_sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach wheels + sdist to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Auto-generate the release body from the PR titles between tags
          # (same notes antennaknobs releases get). Only fills the body when
          # the release is first created — re-runs never clobber edits.
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    # Publish the wheels + sdist to PyPI via Trusted Publishing (OIDC) — no
    # stored token. Requires a matching trusted/pending publisher configured on
    # PyPI (pypi.org, NOT test.pypi.org) for project `momwire`: owner
    # stevenmburns, repo momwire, workflow wheels.yml, no environment. Use the
    # "pending publisher" form for the very first release (the project does not
    # exist on PyPI yet) — that first tagged run creates it. Without the
    # publisher configured the OIDC exchange hard-fails (it does NOT skip).
    # Omitting repository-url defaults the action to https://upload.pypi.org/legacy/.
    # skip-existing makes re-runs of an already-published version a no-op instead
    # of an error. Tag-gated, same as the GitHub Release job.
    name: publish to PyPI
    needs: [build_wheels, make_sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
