name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Which lanes are worth running for this diff. A docs- or site-only PR
  # cannot break the solvers, and PR #600 -- one markdown file -- burned
  # sixteen runner-minutes proving it.
  #
  # The guard is on the STEPS below, never on the jobs, and never on the
  # workflow's own `on:` paths. `lint`, `test`, `test-pynec` and `test-slow`
  # are REQUIRED checks: a workflow filtered out at the `on:` level never
  # reports them at all, and branch protection then waits for a result that
  # can never arrive. A job that runs and does nothing reports success in
  # about fifteen seconds, which is the whole point and costs nothing to be
  # certain about.
  #
  # `lint` is deliberately NOT guarded -- ruff runs over the repo in six
  # seconds and a docs PR can still carry a Python snippet.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Everything, minus the paths that cannot change what a solver
          # answers. A PR touching BOTH docs and code matches `**` on its
          # code files and runs the full lanes, which is the safe direction.
          # `scripts/probe_*.py` are hand-run measurement instruments — no
          # test imports one, and `lint` (unguarded) still reads them.
          # Keep this filter identical to the `changes` jobs in wheels.yml
          # and eznec-dropin.yml — three copies of one rule, and a copy is
          # the thing that drifts.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!scripts/probe_*.py'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pinned (matches antennaknobs' ruff.yml): the unpinned `pip install
      # ruff` pulls the latest release, so a new ruff version silently turns
      # CI red on pre-existing code with no repo change. Bump this pin
      # deliberately, alongside the repo-wide `ruff check` cleanup it implies.
      - run: pip install ruff==0.15.21
      - run: ruff check
      # Formatter drift is invisible without this — `ruff format` was
      # previously unenforced, so unformatted commits accumulated
      # silently (site/figures are excluded by [tool.ruff.format]).
      - run: ruff format --check

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # The extension is ONE 8,063-line translation unit at -O3, and compiling
      # it costs 57-70 s in every job that installs the package -- five of
      # them, on every PR. `cache: pip` above caches downloaded WHEELS, not
      # that compile, so it ran from scratch every time. Measured over the 60
      # commits before this one: SIX touch `_accelerators.cpp` and all six are
      # the single #568 arc, so nine PRs in ten recompiled identical C++ five
      # times for nothing.
      #
      # `--no-build-isolation` is not a second optimisation, it is what makes
      # the cache HIT AT ALL. Build isolation puts pybind11's headers under a
      # fresh /tmp/pip-build-env-XXXXXX every run; that path lands on the
      # compile command line, ccache hashes the command line, and every run
      # would miss. With the build deps in the job's own environment the
      # include paths are stable between runs.
      #
      # Measured locally, same scenario as a CI run (warm cache, build
      # directory deleted so setuptools cannot skip the compile itself):
      # 58.7 s cold, 0.6 s warm. The `-g` in the Linux flags does not spoil
      # it -- ccache hashes the source path with debug info, and a runner's
      # workspace path is the same every run.
      #
      # Note on when the win appears: an Actions cache written on a PR branch
      # is readable only from that branch, so THIS PR's own run is cold. The
      # push run on main after merge populates the shared scope, and PRs after
      # that read it.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # Explicit -m: PR lanes must not depend on pyproject's addopts default
      # to keep memgate out. (Also now redundant with addopts — kept explicit
      # on purpose, see #400.)
      #
      # MOMWIRE_403_DUMP arms the byte-oracle mismatch tap (momwire#464):
      # every same_printout mismatch drops its canonicalized (served, stock)
      # pair into the dump dir, and the artifact step ships them on failure.
      # Without this, a flake's assertion repr truncates both printouts and
      # the occurrence burns its own evidence — three did before this step
      # existed (PR #460, the #415 arc twice, PR #474).
      - run: pytest tests/ -m "not slow and not memgate"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_403_DUMP: ${{ github.workspace }}/464-dumps
      - name: Upload byte-oracle mismatch dumps (momwire#464)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-464-dumps
          path: 464-dumps/
          if-no-files-found: ignore

  test-macos:
    needs: changes
    # The platform Ward runs SimNEC on (momwire#527/#528): the suite must
    # pass where the portal's real users live, not only where wheels build.
    # Same lane as `test` (fast marker subset); slow/memgate stay linux-only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install libomp (macOS OpenMP runtime)
        # Apple clang has no bundled OpenMP runtime; setup.py's darwin
        # branch links Homebrew's libomp (LIBOMP_PREFIX) — same step the
        # wheels workflow uses.
        run: brew install libomp
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job; Apple clang rather than gcc.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache clang
          CXX: ccache clang++
      - run: pytest tests/ -m "not slow and not memgate"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_403_DUMP: ${{ github.workspace }}/464-dumps
      - name: Upload byte-oracle mismatch dumps (momwire#464)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-464-dumps-macos
          path: 464-dumps/
          if-no-files-found: ignore

  test-slow:
    needs: changes
    # The slow-marked tests are the solver-regression pins (M3/M4 reference
    # constants, near-open collapse, section-6 oracle, EK brute-force sweep)
    # — until #219 NO lane ran them, so week-old pins had never executed in
    # CI. Disjoint from memgate (#400): a slow test is never also a memgate
    # test, so this excludes memgate explicitly for the same reason as the
    # test job above, even though today nothing marked slow is also marked
    # memgate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # The residency gate (#532) diverges on 0116/0117 out of a RESIDENT
      # process, on runners and not on any machine we can reproduce it on
      # (#677). It is non-strict, so it reports and moves on — which means
      # the occurrence leaves nothing behind unless we ask it to. Same
      # reasoning, and the same shape, as the byte-oracle dumps in the `test`
      # job: an unreproducible failure that discards its own evidence costs
      # a whole CI cycle to learn nothing from.
      #
      # `if: always()` and not `failure()`: the gate is XFAIL, so the job is
      # GREEN when it diverges. `failure()` would never fire, which is
      # exactly the trap that makes this worth a comment.
      - run: pytest tests/ -m "slow and not memgate"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_532_DUMP: ${{ github.workspace }}/677-dumps
      - name: Upload residency mismatch dumps (momwire#677)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-677-dumps
          path: 677-dumps/
          if-no-files-found: ignore

  test-memgate:
    needs: changes
    # Residency/budget certification gates (#400): tracemalloc peaks and
    # byte-budget checks. These pin actual measured allocations, which drift
    # ~5% under CI's allocator noise — cheap to run, but not worth the
    # attention cost on every PR iteration. Runs once, on push to main, so a
    # regression is caught right after merge instead of on every review
    # cycle. Must NOT run on pull_request: the `if` below is the enforcement
    # (this workflow's own `pull_request` trigger would otherwise start it).
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # -n0: memory-certification gates measure peak RSS and cannot share a
      # box with concurrent workers; this lane opts out of addopts' xdist.
      - run: pytest tests/ -m memgate -n0
        if: needs.changes.outputs.code == 'true'

  test-pynec:
    needs: changes
    # Validate that the PyNEC backend agrees with momwire
    # (tests/test_pynec_backend.py). PyNEC is no longer compiled here — it's
    # installed as a prebuilt wheel from the python-necpp fork's GitHub Release
    # (OpenBLAS via scipy-openblas32, OpenMP matrix-fill). That dropped the
    # autoconf/SWIG/OpenBLAS apt installs and the ~2 min C++ build. PyNEC's
    # build coverage — across the atlas/lapacke/mkl/openblas backends and on
    # Windows — now lives in python-necpp's own CI, which is its proper home;
    # this job only needs *a* working PyNEC to compare against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same build + test deps as the plain lane (no fastapi — the web server
      # was retired); PyNEC is added from the fork's wheel in the next step.
      # Same ccache reasoning as the `test` job -- this lane is the starkest
      # case of it: 69 s of install for 3 s of tests.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Install pynec-accel from the python-necpp release wheel
        if: needs.changes.outputs.code == 'true'
        # --no-index so the ONLY candidate is the fork's wheel — never upstream
        # PyNEC on PyPI, which lacks our BLAS/OpenMP work and doesn't load on
        # the target machines. (The fork's distribution is `pynec-accel`; the
        # import name stays PyNEC.) numpy is already installed above, so no
        # package index is needed to satisfy deps.
        run: |
          pip install pynec-accel --no-index \
            --find-links https://github.com/stevenmburns/python-necpp/releases/expanded_assets/v1.7.6
      - run: pytest tests/test_pynec_backend.py -v
        if: needs.changes.outputs.code == 'true'
