name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Which lanes are worth running for this diff. A docs- or site-only PR
  # cannot break the solvers, and PR #600 -- one markdown file -- burned
  # sixteen runner-minutes proving it.
  #
  # The guard is on the STEPS below, never on the jobs, and never on the
  # workflow's own `on:` paths. `lint`, `test`, `test-pynec` and `test-slow`
  # are REQUIRED checks: a workflow filtered out at the `on:` level never
  # reports them at all, and branch protection then waits for a result that
  # can never arrive. A job that runs and does nothing reports success in
  # about fifteen seconds, which is the whole point and costs nothing to be
  # certain about.
  #
  # `lint` is deliberately NOT guarded -- ruff runs over the repo in six
  # seconds and a docs PR can still carry a Python snippet.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Everything, minus the paths that cannot change what a solver
          # answers. A PR touching BOTH docs and code matches `**` on its
          # code files and runs the full lanes, which is the safe direction.
          # `scripts/probe_*.py` are hand-run measurement instruments — no
          # test imports one, and `lint` (unguarded) still reads them.
          # Keep this filter identical to the `changes` jobs in wheels.yml
          # and eznec-dropin.yml — three copies of one rule, and a copy is
          # the thing that drifts.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!scripts/probe_*.py'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pinned (matches antennaknobs' ruff.yml): the unpinned `pip install
      # ruff` pulls the latest release, so a new ruff version silently turns
      # CI red on pre-existing code with no repo change. Bump this pin
      # deliberately, alongside the repo-wide `ruff check` cleanup it implies.
      - run: pip install ruff==0.15.21
      - run: ruff check
      # Formatter drift is invisible without this — `ruff format` was
      # previously unenforced, so unformatted commits accumulated
      # silently (site/figures are excluded by [tool.ruff.format]).
      - run: ruff format --check

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # The extension is five translation units (momwire#687 split the old
      # 8,063-line monolith) compiled at -O3 in every job that installs the
      # package -- five jobs, on every PR. `cache: pip` above caches
      # downloaded WHEELS, not that compile, so it ran from scratch every
      # time. Most PRs touch no accelerator C++ at all (measured pre-split:
      # nine PRs in ten recompiled identical C++ five times for nothing), and
      # the split means a PR that touches ONE section re-compiles one TU and
      # ccache serves the rest.
      #
      # `--no-build-isolation` is not a second optimisation, it is what makes
      # the cache HIT AT ALL. Build isolation puts pybind11's headers under a
      # fresh /tmp/pip-build-env-XXXXXX every run; that path lands on the
      # compile command line, ccache hashes the command line, and every run
      # would miss. With the build deps in the job's own environment the
      # include paths are stable between runs.
      #
      # Measured locally, same scenario as a CI run (warm cache, build
      # directory deleted so setuptools cannot skip the compile itself):
      # 58.7 s cold, 0.6 s warm. The `-g` in the Linux flags does not spoil
      # it -- ccache hashes the source path with debug info, and a runner's
      # workspace path is the same every run.
      #
      # Note on when the win appears: an Actions cache written on a PR branch
      # is readable only from that branch, so THIS PR's own run is cold. The
      # push run on main after merge populates the shared scope, and PRs after
      # that read it.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # Explicit -m: PR lanes must not depend on pyproject's addopts default
      # to keep memgate out. (Also now redundant with addopts — kept explicit
      # on purpose, see #400.)
      #
      # MOMWIRE_403_DUMP arms the byte-oracle mismatch tap (momwire#464):
      # every same_printout mismatch drops its canonicalized (served, stock)
      # pair into the dump dir, and the artifact step ships them on failure.
      # Without this, a flake's assertion repr truncates both printouts and
      # the occurrence burns its own evidence — three did before this step
      # existed (PR #460, the #415 arc twice, PR #474).
      - run: pytest tests/ -m "not slow and not memgate and not integration"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_403_DUMP: ${{ github.workspace }}/464-dumps
      - name: Upload byte-oracle mismatch dumps (momwire#464)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-464-dumps
          path: 464-dumps/
          if-no-files-found: ignore

  test-macos:
    needs: changes
    # The platform Ward runs SimNEC on (momwire#527/#528): the suite must
    # pass where the portal's real users live, not only where wheels build.
    # Same lane as `test` (fast marker subset); slow/memgate stay linux-only.
    # It KEEPS the integration tests the linux PR lane now excludes
    # (momwire#692): those are the subprocess/socket/CLI tests, which is
    # exactly where platforms differ, so dropping them here would leave
    # the only macOS lane covering the least platform-sensitive code.
    #
    # NOT a PR gate (turnaround work, 2026-08-28), and the reason is what
    # this lane was actually FOR. #527's body reads as a macOS bug report; it
    # was not. AE6TY's SimNEC crashed on the portal's output on LINUX — the
    # macOS side of it was that momwire would not run in the AE6TY
    # development environment at all, so the crash could only be reproduced
    # somewhere it could not be debugged. This lane exists to make momwire
    # BUILD AND PASS on macOS so that debugging can happen there. That is
    # enablement scaffolding, not a regression gate, and it does not need to
    # block a review cycle.
    #
    # The numbers agree. Over 119 ci.yml runs (2026-08-25..27) it failed
    # twice in 117, and BOTH were shared with the linux `test` job: zero
    # macOS-specific catches, two bugs found twice, at 4:17 on the critical
    # path that decides how many edit->signal turns an hour this repo
    # supports.
    #
    # Kept on push (not deleted) because the statistics are the weak argument
    # here and the mechanism is the strong one: the C++ accelerator is
    # compiled per platform and `brew install libomp` above exists because
    # OpenMP linkage is where the platforms genuinely differ. That class has
    # bitten already — pynec-accel's vendored libgomp silently disabling the
    # accelerator through a static-TLS clash — and a silent accelerator
    # passes every assertion in this suite. Three clean days is not evidence
    # it cannot happen. `wheels.yml` is the second net, running a macos-14
    # cross-engine leg on every main push and every `v*` tag; it validates a
    # WHEEL, though, not the suite, which is why this lane still earns a run.
    runs-on: macos-14
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install libomp (macOS OpenMP runtime)
        # Apple clang has no bundled OpenMP runtime; setup.py's darwin
        # branch links Homebrew's libomp (LIBOMP_PREFIX) — same step the
        # wheels workflow uses.
        run: brew install libomp
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job; Apple clang rather than gcc.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache clang
          CXX: ccache clang++
      - run: pytest tests/ -m "not slow and not memgate"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_403_DUMP: ${{ github.workspace }}/464-dumps
      - name: Upload byte-oracle mismatch dumps (momwire#464)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-464-dumps-macos
          path: 464-dumps/
          if-no-files-found: ignore

  test-integration:
    needs: changes
    # Tests that cross a process, a socket, a CLI, or the deck->printout seam
    # (momwire#692). Classified by NATURE, not duration: 306 of the 403 marked
    # functions run under 3 s and cost 80 s between them, but a socket test
    # that finishes in 0.2 s is still not an edit-loop guard.
    #
    # Push-only for the same reason as test-slow: the PR lane decides how many
    # edit->signal turns an hour this repo supports, and releases — not main —
    # are the supported artifact. Measured on an 8-core box: the PR lane goes
    # 4:17 -> 2:29, and this lane costs 2:02.
    #
    # `not slow` is load-bearing. A test can carry both markers, and without
    # the exclusion this lane sweeps in the certification solves and runs
    # 5:19 instead of 2:02.
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
      - run: pip install --upgrade pip
      - run: pip install "setuptools>=61.0" wheel pybind11
      - run: pip install -e .[test] --no-build-isolation
      - run: pytest tests/ -m "integration and not slow and not memgate"

  test-slow:
    needs: changes
    # NOT a PR gate (turnaround work, 2026-08-28). Over 119 runs this was the
    # most failure-prone job (3 of 117) and every failure was unique to it —
    # but two of the three were momwire#677's residency divergence, a known
    # CI-only issue whose gate #678 has since put back to non-strict, and the
    # third was a stale expectation (#611's gal/bs2 gap assertion), not a
    # shipped-behaviour regression. Forward-looking that is ~1 real catch per
    # 75 PRs against 1.5 min added to every review cycle. It runs one merge
    # later instead, where nobody is waiting on it.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    # The slow-marked tests are the solver-regression pins (M3/M4 reference
    # constants, near-open collapse, section-6 oracle, EK brute-force sweep)
    # — until #219 NO lane ran them, so week-old pins had never executed in
    # CI. Disjoint from memgate (#400): a slow test is never also a memgate
    # test, so this excludes memgate explicitly for the same reason as the
    # test job above, even though today nothing marked slow is also marked
    # memgate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # `not crossgate`: the crossing-serve eps1 certification solves are
      # ALSO marked slow (so fast lanes and wheel smoke exclude them for
      # free) and run in their own merge-to-main lane below — the PR slow
      # lane keeps the soil-A crossing anchor pin (test_g524_4), which is
      # the per-PR regression guard for the crossing fill.
      #
      # The residency gate (#532) once diverged on 0116/0117 out of a
      # RESIDENT process, on runners only (#677) — these dumps are what
      # caught it: five runs, twenty pairs, one NETWORK LOSS dust line,
      # fixed by the seam's presence floor. The gate is strict again; the
      # dump tap STAYS, because the next process-history leak will also be
      # runner-only and a failure that discards its own evidence costs a
      # whole CI cycle to learn nothing from.
      - run: pytest tests/ -m "slow and not memgate and not crossgate"
        if: needs.changes.outputs.code == 'true'
        env:
          MOMWIRE_532_DUMP: ${{ github.workspace }}/677-dumps
      # The gate is XFAIL, so a divergence leaves the job GREEN and the
      # artifact silent -- and an artifact nobody is told about only helps
      # someone who already suspected there was something to look at. Say it
      # out loud instead, on the run page and in the job summary. This is
      # also why the upload below is `if: always()` and not `failure()`,
      # which would never fire.
      - name: Flag a captured residency divergence (momwire#677)
        if: always()
        run: |
          if [ -n "$(ls -A 677-dumps 2>/dev/null)" ]; then
            n=$(ls -1 677-dumps | wc -l)
            echo "::warning::momwire#677 REPRODUCED: $n dump file(s) captured. Download the momwire-677-dumps artifact -- this is the evidence the issue is waiting on."
            {
              echo "### momwire#677 reproduced on this run"
              echo
              echo "\`$n\` dump file(s) in the \`momwire-677-dumps\` artifact:"
              echo
              ls -1 677-dumps | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "momwire#677 did not reproduce on this run."
          fi
      - name: Upload residency mismatch dumps (momwire#677)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momwire-677-dumps
          path: 677-dumps/
          if-no-files-found: ignore

  test-crossgate:
    needs: changes
    # Crossing-serve eps1 certification (momwire#524): the collapse
    # adjudicators re-solve multi-minute crossing decks against independent
    # free-space truths. Same reasoning as test-memgate: certification, not
    # an edit-loop guard — runs once on push to main so a regression is
    # caught right after merge instead of on every review cycle. Must NOT
    # run on pull_request: the `if` below is the enforcement.
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # Inherits addopts' xdist (-n auto): unlike memgate these gates
      # measure impedances, not memory peaks, and parallelize fine.
      - run: pytest tests/ -m crossgate
        if: needs.changes.outputs.code == 'true'

  test-memgate:
    needs: changes
    # Residency/budget certification gates (#400): tracemalloc peaks and
    # byte-budget checks. These pin actual measured allocations, which drift
    # ~5% under CI's allocator noise — cheap to run, but not worth the
    # attention cost on every PR iteration. Runs once, on push to main, so a
    # regression is caught right after merge instead of on every review
    # cycle. Must NOT run on pull_request: the `if` below is the enforcement
    # (this workflow's own `pull_request` trigger would otherwise start it).
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same reasoning as the `test` job.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
      # -n0: memory-certification gates measure peak RSS and cannot share a
      # box with concurrent workers; this lane opts out of addopts' xdist.
      - run: pytest tests/ -m memgate -n0
        if: needs.changes.outputs.code == 'true'

  test-pynec:
    needs: changes
    # Validate that the PyNEC backend agrees with momwire
    # (tests/test_pynec_backend.py). PyNEC is no longer compiled here — it's
    # installed as a prebuilt wheel from the python-necpp fork's GitHub Release
    # (OpenBLAS via scipy-openblas32, OpenMP matrix-fill). That dropped the
    # autoconf/SWIG/OpenBLAS apt installs and the ~2 min C++ build. PyNEC's
    # build coverage — across the atlas/lapacke/mkl/openblas backends and on
    # Windows — now lives in python-necpp's own CI, which is its proper home;
    # this job only needs *a* working PyNEC to compare against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ github.job }}-${{ runner.os }}
      - run: pip install --upgrade pip
        if: needs.changes.outputs.code == 'true'
      # Mirrors `build-system.requires` in pyproject.toml -- keep the two in
      # step. Installed HERE rather than left to build isolation so that
      # `--no-build-isolation` below can find them.
      - run: pip install "setuptools>=61.0" wheel pybind11
        if: needs.changes.outputs.code == 'true'
      # Same build + test deps as the plain lane (no fastapi — the web server
      # was retired); PyNEC is added from the fork's wheel in the next step.
      # Same ccache reasoning as the `test` job -- this lane is the starkest
      # case of it: 69 s of install for 3 s of tests.
      - run: pip install -e .[test] --no-build-isolation
        if: needs.changes.outputs.code == 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Install pynec-accel from the python-necpp release wheel
        if: needs.changes.outputs.code == 'true'
        # --no-index so the ONLY candidate is the fork's wheel — never upstream
        # PyNEC on PyPI, which lacks our BLAS/OpenMP work and doesn't load on
        # the target machines. (The fork's distribution is `pynec-accel`; the
        # import name stays PyNEC.) numpy is already installed above, so no
        # package index is needed to satisfy deps.
        run: |
          pip install pynec-accel --no-index \
            --find-links https://github.com/stevenmburns/python-necpp/releases/expanded_assets/v1.7.6
      - run: pytest tests/test_pynec_backend.py -v
        if: needs.changes.outputs.code == 'true'
