# The FAT Windows no-Python executables (MSVC, MW_EXE_VARIANT=fat): one per
# basis, `momwire-nec5-razor-2p` and `momwire-nec5-bspline`, each carrying
# the avx2 and the sse2 cores and picking one at run time by CPU
# (momwire_razor2p.cpp `pick_variant`; MOMWIRE_FORCE_VARIANT names one). The
# DLLs are windows-nopython's (standalone.yml): numpy's OpenBLAS
# (scipy-openblas32), the 14.44 toolset's VC++ runtime and LLVM's libomp140.
#
# An experiment beside the shipped zip, which it does not touch: standalone.yml
# still builds and ships the four one-variant executables. The gates, each
# against one-variant builds made in this job from the same commit:
#
#   1. the link (scripts/windows_fat/check_link.py): no start-up entry in an
#      avx2 copy, the deferred avx2 initializers run on avx2 only, and no
#      COMDAT an sse2 object defines resolved to its avx2 copy;
#   2. every fixture deck and NX chain byte for byte against the one-variant
#      executable, both paths (forced), both copies (fat_compare.py);
#   3. Intel SDE: Westmere and Sandy Bridge pick sse2, Haswell avx2, with no
#      illegal instruction, printouts identical to the one-variant build under
#      the same emulated CPU -- Westmere over the whole corpus;
#   4. windows-nopython's corpus gate (exe_compare --standalone --rtol win32)
#      and the launcher contract tests on the fat executables;
#   5. the import tables against the one-variant executables', sizes, the
#      Windows 7 import gate and a rehearsal signature;
#   6. indicative timing, fat against one-variant, on this runner.
name: windows-fat

on:
  workflow_dispatch:
  push:
    branches: [fat-msvc-exe]

env:
  MOMWIRE_BELOW_ANCHORS: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-fat:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: numpy's OpenBLAS (scipy-openblas32)
        shell: pwsh
        run: |
          $v = (Select-String -Path standalone/build_openblas.sh -Pattern '^NUMPY_OPENBLAS_VERSION=(.+)$').Matches[0].Groups[1].Value
          "scipy-openblas32==$v"
          python -m pip download -q --no-deps --only-binary=:all: "scipy-openblas32==$v" -d obwhl
          python -m zipfile -e (Get-ChildItem obwhl\*.whl).FullName ob
          Get-Item ob\scipy_openblas32\lib\libscipy_openblas.dll | Select-Object FullName, Length
      - name: momwire environment
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install -q -U pip setuptools wheel pybind11
          venv\Scripts\python -m pip install -q -e ".[test]"
          venv\Scripts\python -m pip install -q pefile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'
      # windows-nopython's four one-variant builds, verbatim, and the two fat ones
      - name: configure + build (MSVC 14.44, four one-variant and two fat executables)
        shell: pwsh
        run: |
          python -m pip install -q ninja
          $banner = (cmd /c "cl 2>&1" | Select-Object -First 1)
          $banner
          if ($banner -notmatch 'Version 19\.44\.') { throw "cl is not the 14.44 toolset: $banner" }
          $dll = "$PWD\ob\scipy_openblas32\lib\libscipy_openblas.dll"
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2', 'fat') {
              $t0 = Get-Date
              cmake -S standalone -B "build-$b-$v" -G Ninja -DCMAKE_BUILD_TYPE=Release -DMW_EXE_NO_PYTHON=ON `
                "-DMW_EXE_BASIS=$(if ($b -eq 'bs2') { 'bspline_nec5' } else { $b })" "-DMW_EXE_VARIANT=$v" "-DMW_OPENBLAS_LIB=$dll" -DMW_BLAS_PREFIX=scipy_
              if ($LASTEXITCODE) { exit 1 }
              cmake --build "build-$b-$v"
              if ($LASTEXITCODE) { exit 1 }
              "build-$b-$v : $([int]((Get-Date) - $t0).TotalSeconds) s"
            }
          }
      - name: stage (one-variant and fat trees, the same DLLs beside each)
        shell: pwsh
        run: |
          $one = "dist\one"; $fat = "dist\fat"
          New-Item -ItemType Directory -Force $one, $fat | Out-Null
          $target = @{ 'razor2p' = 'momwire-nec5-razor-2p-standalone'; 'bs2' = 'momwire-nec5-bspline-standalone' }
          $name = @{ 'razor2p' = 'momwire-nec5-razor-2p'; 'bs2' = 'momwire-nec5-bspline' }
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2') { Copy-Item "build-$b-$v\$($target[$b]).exe" "$one\momwire-nec5-$b-$v.exe" }
            Copy-Item "build-$b-fat\$($target[$b]).exe" "$fat\$($name[$b]).exe"
            Copy-Item "build-$b-fat\$($target[$b]).map" "dist\$($name[$b]).map"
          }
          $crt = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          foreach ($dir in $one, $fat) {
            Copy-Item ob\scipy_openblas32\lib\libscipy_openblas.dll $dir
            foreach ($f in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item "$crt\$f" $dir }
            Copy-Item "$env:SystemRoot\System32\libomp140.x86_64.dll" $dir
          }
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
      # Gate 1: the link, read back from the image and the map file
      - name: the fat link (start-up tables, deferred initializers, COMDATs)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            "=== $($b[1])"
            venv\Scripts\python scripts/windows_fat/check_link.py "dist\fat\$($b[1]).exe" "dist\$($b[1]).map" "build-$($b[0])-fat"
            if ($LASTEXITCODE) { $fail = 1 }
          }
          exit $fail
      # Gate 5: the same DLLs as the one-variant executables, and the sizes
      - name: import tables and sizes, fat against one-variant
        shell: pwsh
        run: |
          # the dependency lists (load-time and delay-load), header to Summary
          function deps($exe) {
            $out = @(dumpbin /nologo /dependents $exe)
            $a = [array]::FindIndex($out, [Predicate[string]]{ param($l) $l -match 'Image has the following' })
            $z = [array]::FindIndex($out, [Predicate[string]]{ param($l) $l -match '^\s*Summary' })
            (($out[$a..($z - 1)] | ForEach-Object { $_.Trim().ToLower() } | Where-Object { $_ }) -join '; ')
          }
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            $f = "dist\fat\$($b[1]).exe"
            $df = deps $f
            "$($b[1]).exe (fat): $((Get-Item $f).Length) bytes; $df"
            foreach ($v in 'avx2', 'sse2') {
              $o = "dist\one\momwire-nec5-$($b[0])-$v.exe"
              $do = deps $o
              "  momwire-nec5-$($b[0])-$v.exe: $((Get-Item $o).Length) bytes; $do"
              if ($df -ne $do) { "::error::$($b[1]) fat imports differ from $v"; $fail = 1 }
            }
            dumpbin /nologo /dependents $f
          }
          python -m pip install -q pefile
          python scripts/eznec_freeze/scan_win7_imports.py dist\fat
          if ($LASTEXITCODE) { $fail = 1 }
          exit $fail
      - name: rehearsal signature (self-signed) on the fat executables
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=momwire standalone rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          $env:MOMWIRE_SIGN_SHA1 = $cert.Thumbprint
          $env:MOMWIRE_SIGN_ALLOW_UNTRUSTED = "1"
          $env:MOMWIRE_SIGN_TIMESTAMP_URL = "http://timestamp.acs.microsoft.com"
          python standalone/sign_windows.py (Get-ChildItem dist\fat\*.exe).FullName
          if ($LASTEXITCODE) { exit 1 }
          foreach ($e in Get-ChildItem dist\fat\*.exe) {
            $s = Get-AuthenticodeSignature $e.FullName
            "$($e.Name): $($s.Status) $($e.Length) bytes"
            if (-not $s.SignerCertificate) { throw "$($e.Name) is not signed" }
          }
      - name: run from the staged tree (System32-only PATH)
        shell: pwsh
        run: |
          $deck = "$PWD\tests\fixtures\razor_printout_3a\node_gap_two_sources.nec"
          $stream = "$PWD\scripts\core_split\nx_decks\simnec_stream_2281566.nec"
          $env:PATH = "$env:SystemRoot\System32"
          foreach ($e in Get-ChildItem dist\fat -Filter *.exe) {
            foreach ($v in '', 'sse2') {
              if ($v) { $env:MOMWIRE_FORCE_VARIANT = $v } else { Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore }
              & $e.FullName -version
              $out = "$env:RUNNER_TEMP\$($e.BaseName)-$v.out"
              & $e.FullName $deck $out
              if ($LASTEXITCODE) { exit 1 }
              "$($e.Name) [$v]: $((Get-Content $out)[1])"
              if (Select-String -Quiet "NEC ERROR" $out) { exit 1 }
              cmd /c "`"$($e.FullName)`" - - < `"$stream`" > `"$out.stream`""
              if ($LASTEXITCODE) { exit 1 }
              $n = (Select-String -Pattern 'INPUT LINE .* NX ' "$out.stream").Count
              "  stream: $n structures"
              if ($n -lt 1) { exit 1 }
            }
          }
      # Gate 2: byte for byte against the one-variant builds, both paths forced
      - name: fat == one-variant, every fixture deck (razor-2p and bs2, avx2 and sse2)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            foreach ($v in 'avx2', 'sse2') {
              "=== $($b[1]) $v"
              venv\Scripts\python scripts/windows_fat/fat_compare.py "dist\fat\$($b[1]).exe" $v "dist\one\momwire-nec5-$($b[0])-$v.exe" `
                tests/fixtures scripts/core_split/nx_decks scripts/core_split/bs2_stream_decks
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      # Gate 3: Intel SDE emulates each CPU's CPUID and faults on any
      # instruction it lacks -- static initialisers included. The fat
      # executable picks by CPU here (no MOMWIRE_FORCE_VARIANT); the
      # one-variant build of the variant that CPU should get answers under the
      # same emulated CPU (the DLLs pick their kernels by CPUID too).
      - uses: petarpetrovt/setup-sde@v6.0
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - name: SDE (wsm, snb -> sse2; hsw -> avx2), the picked path and three decks
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          $sde = Join-Path $env:SDE_PATH 'sde.exe'
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            $fat = (Resolve-Path "dist\fat\$($b[1]).exe").Path
            foreach ($cpu in 'wsm', 'snb', 'hsw') {
              $want = if ($cpu -eq 'hsw') { 'avx2' } else { 'sse2' }
              Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore
              $env:MW_EXE_TIMES = '1'
              $v = (& $sde "-$cpu" -- $fat -version 2>&1) -join ' | '
              $rc = $LASTEXITCODE
              Remove-Item Env:MW_EXE_TIMES
              "$($b[1]) under -$cpu : rc=$rc $v"
              if ($rc -or $v -notmatch "-standalone-$want " -or $v -notmatch "simd $want") { "::error::$($b[1]) -$cpu picked wrong or failed"; $fail = 1; continue }
              if ($want -eq 'sse2' -and $v -match 'avx2 initializers') { "::error::$($b[1]) -$cpu ran avx2 initializers"; $fail = 1 }
              if ($want -eq 'avx2' -and $v -notmatch 'avx2 initializers') { "::error::$($b[1]) -$cpu ran no avx2 initializers"; $fail = 1 }
              venv\Scripts\python scripts/windows_fat/fat_compare.py $fat $want "dist\one\momwire-nec5-$($b[0])-$want.exe" `
                tests/fixtures/razor_printout_3a/node_gap_two_sources.nec tests/fixtures/bspline_printout_buried/ab_hub16.nec `
                tests/fixtures/eznec/decks/0068_nbs-yagi-ant-book-p-18-7.nec --auto --sde $sde --cpu $cpu
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      - name: SDE Westmere, every fixture deck (the sse2 path picked by CPU)
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          $sde = Join-Path $env:SDE_PATH 'sde.exe'
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            "=== $($b[1]) -wsm"
            $t0 = Get-Date
            venv\Scripts\python scripts/windows_fat/fat_compare.py "dist\fat\$($b[1]).exe" sse2 "dist\one\momwire-nec5-$($b[0])-sse2.exe" `
              tests/fixtures scripts/core_split/nx_decks scripts/core_split/bs2_stream_decks --auto --sde $sde --cpu wsm
            if ($LASTEXITCODE) { $fail = 1 }
            "  $([int]((Get-Date) - $t0).TotalSeconds) s"
          }
          exit $fail
      # Gate 4: windows-nopython's gates on the fat executables
      - name: contract tests on the fat executables
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = (Resolve-Path dist\fat\momwire-nec5-razor-2p.exe).Path
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = (Resolve-Path dist\fat\momwire-nec5-bspline.exe).Path
          $env:MOMWIRE_STANDALONE_BASIS = "bspline"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
      - name: every fixture deck and the NX chains on the fat executables (avx2 by CPU, sse2 forced)
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            foreach ($v in 'avx2', 'sse2') {
              if ($v -eq 'sse2') { $env:MOMWIRE_FORCE_VARIANT = 'sse2' } else { Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore }
              $extra = @()
              $L = "$PWD\venv\Scripts\momwire-nec5-razor-2p.exe"
              if ($b[0] -eq 'bs2') { $extra = @('--basis', 'bspline', 'scripts/core_split/bs2_stream_decks'); $L = "$PWD\venv\Scripts\momwire-nec5-bspline.exe" }
              "=== $($b[1]) $v"
              venv\Scripts\python scripts/core_split/exe_compare.py "dist/exe-fat-$($b[0])-$v.jsonl" --standalone --rtol win32 `
                --exe "dist\fat\$($b[1]).exe" --launcher $L --workers 4 @extra tests/fixtures scripts/core_split/nx_decks
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      # Gate 6 (indicative): the same runner, interleaved
      - name: indicative timing, fat against one-variant (avx2 by CPU)
        if: always() && hashFiles('dist/fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore
          $O = (Resolve-Path dist\one).Path; $F = (Resolve-Path dist\fat).Path
          venv\Scripts\python scripts/windows_fat/time_exes.py dist/timing.jsonl `
            "one/razor2p=$O\momwire-nec5-razor2p-avx2.exe" "fat/razor2p=$F\momwire-nec5-razor-2p.exe" `
            "one/bs2=$O\momwire-nec5-bs2-avx2.exe" "fat/bs2=$F\momwire-nec5-bspline.exe"
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: momwire-nec5-windows-x64-fat-SELFSIGNED-rehearsal
          path: |
            dist/fat/*.exe
            dist/*.map
            dist/*.jsonl
          if-no-files-found: warn
          retention-days: 7
