# The no-Python executables on Windows as SINGLE FILES (an experiment beside
# standalone.yml's MSVC `windows-nopython`, which it does not touch): MinGW-w64
# gcc in MSYS2's MINGW64 environment -- the msvcrt.dll runtime, the import
# shape of Ward's single-file NEC5CL build (KERNEL32 + msvcrt; m85 measured,
# in place of m90) -- razor-2p and bs2, avx2 and sse2, every runtime linked in:
#
#   * OpenBLAS: standalone/build_openblas.sh's two archives, unchanged -- the
#     SAME pinned commits as Linux (SciPy's `mwx_`, numpy's `mwn_`), built
#     here with MINGW64's gcc;
#   * libgomp from its archive (MW_EXE_STATIC_GOMP), and -static for
#     libstdc++, libgcc and winpthreads (CMakeLists.txt's MINGW block).
#
# Phase 2: the FAT executables, one per basis under the launchers' names
# (momwire-nec5-razor-2p.exe, momwire-nec5-bspline.exe), avx2 and sse2 inside
# and picked at run time by CPU (MW_EXE_VARIANT=fat), gated byte for byte
# against the one-variant builds, and run under Intel SDE as CPUs without
# AVX2 (Sandy Bridge) and without AVX (Westmere).
#
# Gated, as windows-nopython is: an import table of system DLLs only (hard),
# the freeze's Windows 7 import gate, a rehearsal signature, a run from a
# System32-only PATH, the launcher contract tests, and every fixture deck and
# NX chain against this environment's launcher within PRINTOUT_RTOL_WIN32
# (Windows needs no bit-compatibility). Then an INDICATIVE timing table
# against the MSVC zip of the latest green standalone.yml run on main, on this
# same runner (a shared VM: the pairing is the point, not the numbers).
name: windows-static

on:
  workflow_dispatch:
  push:
    branches: [windows-static-exe]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOMWIRE_BELOW_ANCHORS: "off"  # as standalone.yml: exact tables for the gates

jobs:
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read  # the MSVC zip from standalone.yml's run on main
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: toolchain
        shell: msys2 {0}
        run: |
          gcc --version | head -1
          ld --version | head -1
          echo "libgomp: $(gcc -print-file-name=libgomp.a)"
          [ -f "$(gcc -print-file-name=libgomp.a)" ] || { echo "::error::no libgomp.a"; exit 1; }
          # C99 printf (two-digit exponents), not msvcrt.dll's, for the printouts
          echo "C++ stdio: $(echo | g++ -dM -E -x c++ -include cstdio - | grep __USE_MINGW_ANSI_STDIO || echo none)"
          # the fat build defers its avx2 constructors through .data$ grouped-section sorting
          ld --verbose | grep -n "data\\\$\|ctors" | head -8
          echo "libwinpthread: $(gcc -print-file-name=libwinpthread.a)"
          echo "CRT: $(gcc -dumpspecs | grep -o -- '-lmsvcrt\|-lucrt' | sort -u | tr '\n' ' ')"
      # build_openblas.sh's two archives, keyed on the script (it holds the
      # commits) and the environment
      - uses: actions/cache/restore@v4
        id: obcache
        with:
          path: |
            obw/libmwxp.a
            obw/libmwnp.a
          key: openblas-mingw64-${{ hashFiles('standalone/build_openblas.sh') }}-v1
      - name: OpenBLAS (build_openblas.sh, MINGW64)
        if: steps.obcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! standalone/build_openblas.sh "$PWD/obw"; then
            tail -60 obw/build-*.log
            exit 1
          fi
      # saved at once, so a later step's failure does not cost the next run
      # the build
      - uses: actions/cache/save@v4
        if: steps.obcache.outputs.cache-hit != 'true'
        with:
          path: |
            obw/libmwxp.a
            obw/libmwnp.a
          key: ${{ steps.obcache.outputs.cache-primary-key }}
      - name: the archives
        shell: msys2 {0}
        run: |
          # PE COMDAT section names follow the prefix (pe_comdat_prefix.sh says
          # why); idempotent, so a cached archive takes it too
          standalone/pe_comdat_prefix.sh obw/libmwxp.a mwx_
          standalone/pe_comdat_prefix.sh obw/libmwnp.a mwn_
          objdump -h obw/libmwnp.a | grep -m3 refptr || true
          ls -l obw/libmwxp.a obw/libmwnp.a
          for a in mwx_:obw/libmwxp.a mwn_:obw/libmwnp.a; do
            p=${a%%:*} f=${a#*:}
            n=$(nm -g --defined-only "$f" 2>/dev/null | awk 'NF == 3' | wc -l)
            bare=$(nm -g --defined-only "$f" 2>/dev/null | awk -v p="$p" 'NF == 3 && index($3, p) != 1' | wc -l)
            echo "$f: $n defined globals, $bare without the $p prefix"
            [ "$bare" -eq 0 ] || { nm -g --defined-only "$f" | awk -v p="$p" 'NF == 3 && index($3, p) != 1' | head; exit 1; }
          done
      - name: configure + build (MinGW-w64, four executables)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist
          for b in razor2p bs2; do
            basis=$b target=momwire-nec5-razor-2p-standalone
            [ $b = bs2 ] && basis=bspline_nec5 target=momwire-nec5-bspline-standalone
            for v in avx2 sse2; do
              cmake -S standalone -B "build-$b-$v" -G Ninja -DCMAKE_BUILD_TYPE=Release -DMW_EXE_NO_PYTHON=ON \
                -DMW_EXE_BASIS=$basis -DMW_EXE_VARIANT=$v \
                -DMW_OPENBLAS_LIB="$PWD/obw/libmwxp.a" -DMW_OPENBLAS_NUMPY_LIB="$PWD/obw/libmwnp.a" \
                -DMW_BLAS_PREFIX=mwx_ -DMW_EXE_STATIC_GOMP=ON
              cmake --build "build-$b-$v" -- -k 0  # every failing TU at once
              cp "build-$b-$v/$target.exe" "dist/momwire-nec5-$b-$v.exe"
              strip "dist/momwire-nec5-$b-$v.exe"
            done
          done
          ls -l dist
      # HARD: the import table names system DLLs only. Anything else -- an
      # OpenBLAS, libgomp, winpthread, libstdc++ or libgcc DLL, a UCRT
      # api-ms-win-crt-* forwarder -- fails the job.
      - name: import tables (system DLLs only)
        shell: msys2 {0}
        run: |
          fail=0
          : > dist/imports.txt
          for e in dist/*.exe; do
            echo "== $(basename "$e") $(stat -c %s "$e") bytes" | tee -a dist/imports.txt
            objdump -p "$e" | grep "DLL Name" | tee -a dist/imports.txt
            for d in $(objdump -p "$e" | awk '/DLL Name/ {print $3}'); do
              case "$(echo "$d" | tr A-Z a-z)" in
                kernel32.dll|msvcrt.dll|advapi32.dll|ntdll.dll) ;;
                *) echo "::error::$(basename "$e") imports $d"; fail=1 ;;
              esac
            done
          done
          exit $fail
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Windows 7 import gate
        shell: pwsh
        run: |
          python -m pip install -q pefile
          python scripts/eznec_freeze/scan_win7_imports.py dist
          if ($LASTEXITCODE) { exit 1 }
      # Signing works on any PE: the rehearsal certificate, as standalone.yml's
      # non-tag runs sign, and the gates below run the signed bytes.
      - name: rehearsal signature (self-signed)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=momwire standalone rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          $env:MOMWIRE_SIGN_SHA1 = $cert.Thumbprint
          $env:MOMWIRE_SIGN_ALLOW_UNTRUSTED = "1"
          $env:MOMWIRE_SIGN_TIMESTAMP_URL = "http://timestamp.acs.microsoft.com"
          python standalone/sign_windows.py (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE) { exit 1 }
          foreach ($e in Get-ChildItem dist\*.exe) {
            $s = Get-AuthenticodeSignature $e.FullName
            "$($e.Name): $($s.Status) $($s.SignerCertificate.Subject) $($e.Length) bytes"
            if (-not $s.SignerCertificate) { throw "$($e.Name) is not signed" }
          }
      - name: run from a System32-only PATH
        shell: pwsh
        run: |
          $D = (Resolve-Path dist).Path
          $deck = "$PWD\tests\fixtures\razor_printout_3a\node_gap_two_sources.nec"
          $stream = "$PWD\scripts\core_split\nx_decks\simnec_stream_2281566.nec"
          $env:PATH = "$env:SystemRoot\System32"
          foreach ($e in Get-ChildItem $D -Filter *.exe) {
            & $e.FullName -version
            $out = "$env:RUNNER_TEMP\$($e.BaseName).out"
            & $e.FullName $deck $out
            if ($LASTEXITCODE) { exit 1 }
            "$($e.Name): $((Get-Content $out)[1])"
            if (Select-String -Quiet "NEC ERROR" $out) { exit 1 }
            cmd /c "`"$($e.FullName)`" - - < `"$stream`" > `"$out.stream`""
            if ($LASTEXITCODE) { exit 1 }
            $n = (Select-String -Pattern 'INPUT LINE .* NX ' "$out.stream").Count
            "  stream: $n structures"
            if ($n -lt 1) { exit 1 }
          }
      - name: momwire environment
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install -q -U pip setuptools wheel pybind11
          venv\Scripts\python -m pip install -q -e ".[test]"
      - name: contract tests (razor-2p and bs2)
        shell: pwsh
        run: |
          $D = (Resolve-Path dist).Path
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = "$D\momwire-nec5-razor2p-avx2.exe"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = "$D\momwire-nec5-bs2-avx2.exe"
          $env:MOMWIRE_STANDALONE_BASIS = "bspline"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
      # windows-nopython's corpus gate, verbatim but for the executables
      - name: every fixture deck and the NX chains (razor-2p and bs2, avx2 and sse2)
        shell: pwsh
        run: |
          $D = (Resolve-Path dist).Path
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $fail = 0
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2') {
              if ($v -eq 'sse2') { $env:MOMWIRE_FORCE_VARIANT = 'sse2' } else { Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore }
              $extra = @()
              $L = "$PWD\venv\Scripts\momwire-nec5-razor-2p.exe"
              if ($b -eq 'bs2') { $extra = @('--basis', 'bspline', 'scripts/core_split/bs2_stream_decks'); $L = "$PWD\venv\Scripts\momwire-nec5-bspline.exe" }
              "=== $b $v"
              venv\Scripts\python scripts/core_split/exe_compare.py "dist/exe-mingw-$b-$v.jsonl" --standalone --rtol win32 `
                --exe "$D\momwire-nec5-$b-$v.exe" --launcher $L --workers 4 @extra tests/fixtures scripts/core_split/nx_decks
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      # Phase 2, the FAT executables: one per basis, avx2 and sse2 inside,
      # picked at run time by CPU (MW_EXE_VARIANT=fat; momwire_razor2p.cpp
      # `pick_variant`), under the launchers' own names.
      - name: configure + build (fat, two executables)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist-fat
          for b in razor2p bs2; do
            basis=$b target=momwire-nec5-razor-2p-standalone name=momwire-nec5-razor-2p
            [ $b = bs2 ] && basis=bspline_nec5 target=momwire-nec5-bspline-standalone name=momwire-nec5-bspline
            cmake -S standalone -B "build-$b-fat" -G Ninja -DCMAKE_BUILD_TYPE=Release -DMW_EXE_NO_PYTHON=ON \
              -DMW_EXE_BASIS=$basis -DMW_EXE_VARIANT=fat \
              -DMW_OPENBLAS_LIB="$PWD/obw/libmwxp.a" -DMW_OPENBLAS_NUMPY_LIB="$PWD/obw/libmwnp.a" \
              -DMW_BLAS_PREFIX=mwx_ -DMW_EXE_STATIC_GOMP=ON
            cmake --build "build-$b-fat" -- -k 0
            cp "build-$b-fat/$target.exe" "dist-fat/$name.exe"
            # the deferred avx2 constructors ran (this runner has AVX2), and not on sse2
            MW_EXE_TIMES=1 MOMWIRE_FORCE_VARIANT=avx2 "dist-fat/$name.exe" -version 2> ctors.txt; cat ctors.txt
            grep -q "avx2 constructors [1-9]" ctors.txt || { echo "::error::$name ran no avx2 constructors"; exit 1; }
            MW_EXE_TIMES=1 MOMWIRE_FORCE_VARIANT=sse2 "dist-fat/$name.exe" -version 2> ctors.txt; cat ctors.txt
            ! grep -q "avx2 constructors" ctors.txt || { echo "::error::$name ran avx2 constructors on sse2"; exit 1; }
            strip "dist-fat/$name.exe"
          done
          ls -l dist-fat
      - name: fat import tables (system DLLs only)
        shell: msys2 {0}
        run: |
          fail=0
          for e in dist-fat/*.exe; do
            echo "== $(basename "$e") $(stat -c %s "$e") bytes" | tee -a dist/imports.txt
            objdump -p "$e" | grep "DLL Name" | tee -a dist/imports.txt
            for d in $(objdump -p "$e" | awk '/DLL Name/ {print $3}'); do
              case "$(echo "$d" | tr A-Z a-z)" in
                kernel32.dll|msvcrt.dll|advapi32.dll|ntdll.dll) ;;
                *) echo "::error::$(basename "$e") imports $d"; fail=1 ;;
              esac
            done
          done
          exit $fail
      - name: fat Windows 7 gate and rehearsal signature
        shell: pwsh
        run: |
          python scripts/eznec_freeze/scan_win7_imports.py dist-fat
          if ($LASTEXITCODE) { exit 1 }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=momwire standalone rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          $env:MOMWIRE_SIGN_SHA1 = $cert.Thumbprint
          $env:MOMWIRE_SIGN_ALLOW_UNTRUSTED = "1"
          $env:MOMWIRE_SIGN_TIMESTAMP_URL = "http://timestamp.acs.microsoft.com"
          python standalone/sign_windows.py (Get-ChildItem dist-fat\*.exe).FullName
          if ($LASTEXITCODE) { exit 1 }
          foreach ($e in Get-ChildItem dist-fat\*.exe) {
            $s = Get-AuthenticodeSignature $e.FullName
            "$($e.Name): $($s.Status) $($e.Length) bytes"
            if (-not $s.SignerCertificate) { throw "$($e.Name) is not signed" }
          }
      # The fat executables' sse2 path on CPUs that lack AVX2 (Sandy Bridge:
      # AVX but no AVX2/FMA) or AVX at all (Westmere), and the avx2 path on
      # Haswell, under Intel SDE, which emulates each CPU's CPUID and faults
      # on any instruction it lacks: static initialisers included, so an
      # avx2-compiled constructor would fail here. Each printout must be the
      # one-variant executable's bytes (run natively).
      - uses: petarpetrovt/setup-sde@v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - name: fat executables under SDE (wsm, snb -> sse2; hsw -> avx2)
        shell: pwsh
        run: |
          $sde = Join-Path $env:SDE_PATH 'sde.exe'
          $decks = @("tests\fixtures\razor_printout_3a\node_gap_two_sources.nec",
                     "tests\fixtures\bspline_printout_buried\ab_hub16.nec",
                     "tests\fixtures\eznec\decks\0068_nbs-yagi-ant-book-p-18-7.nec")
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            $fat = (Resolve-Path "dist-fat\$($b[1]).exe").Path
            foreach ($cpu in 'wsm', 'snb', 'hsw') {
              $want = if ($cpu -eq 'hsw') { 'avx2' } else { 'sse2' }
              # OpenBLAS picks its kernels by CPUID too: pinned alike for the
              # emulated and the native run, to kernels the emulated CPU has
              $env:OPENBLAS_CORETYPE = if ($cpu -eq 'hsw') { 'Haswell' } else { 'Nehalem' }
              $one = (Resolve-Path "dist\momwire-nec5-$($b[0])-$want.exe").Path
              $v = (& $sde "-$cpu" -- $fat -version) -join ' '
              "$($b[1]) under -$cpu : $v"
              if ($LASTEXITCODE -or $v -notmatch "-standalone-$want ") { "::error::$($b[1]) -$cpu picked wrong or failed"; $fail = 1; continue }
              foreach ($d in $decks) {
                foreach ($copy in 'serial', 'threads') {
                  $o1 = "$env:RUNNER_TEMP\sde.out"
                  if ($copy -eq 'threads') { $env:MW_EXE_COPY = 'threads'; $env:MOMWIRE_THREADS = '2' } else { Remove-Item Env:MW_EXE_COPY, Env:MOMWIRE_THREADS -ErrorAction Ignore }
                  & $sde "-$cpu" -- $fat $d $o1
                  $rc = $LASTEXITCODE
                  $a = if (Test-Path $o1) { [IO.File]::ReadAllBytes($o1) } else { @() }
                  Remove-Item $o1 -ErrorAction Ignore
                  & $one $d $o1
                  $bb = [IO.File]::ReadAllBytes($o1)
                  Remove-Item $o1
                  $same = ($rc -eq 0) -and [System.Linq.Enumerable]::SequenceEqual([byte[]]$a, [byte[]]$bb)
                  "  $(Split-Path -Leaf $d) $copy : rc=$rc identical=$same"
                  if (-not $same) { $fail = 1 }
                }
              }
              Remove-Item Env:MW_EXE_COPY, Env:MOMWIRE_THREADS, Env:OPENBLAS_CORETYPE -ErrorAction Ignore
            }
          }
          exit $fail
      # The fat executables against the one-variant ones, byte for byte, on
      # every fixture deck and NX chain: each path (MOMWIRE_FORCE_VARIANT),
      # each copy (the size policy's, and the threaded one).
      - name: fat == one-variant, every fixture deck (razor-2p and bs2, avx2 and sse2)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($b in @(@('razor2p', 'momwire-nec5-razor-2p'), @('bs2', 'momwire-nec5-bspline'))) {
            foreach ($v in 'avx2', 'sse2') {
              "=== $($b[1]) $v"
              python scripts/windows_static/fat_compare.py "dist-fat\$($b[1]).exe" $v "dist\momwire-nec5-$($b[0])-$v.exe" `
                tests/fixtures scripts/core_split/nx_decks scripts/core_split/bs2_stream_decks
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      - name: contract tests on the fat executables
        if: always() && hashFiles('dist-fat/momwire-nec5-bspline.exe') != ''
        shell: pwsh
        run: |
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = (Resolve-Path dist-fat\momwire-nec5-razor-2p.exe).Path
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = (Resolve-Path dist-fat\momwire-nec5-bspline.exe).Path
          $env:MOMWIRE_STANDALONE_BASIS = "bspline"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
      # Diagnostic (run 43944198706: the fat razor-2p hung twice in ~2800 runs,
      # on tiny decks, at the size policy's threads): how often each build
      # hangs on those decks, and every thread's stack when one does.
      - name: hang probe (diagnostic, not a gate)
        if: always() && hashFiles('build-razor2p-fat/momwire-nec5-razor-2p-standalone.exe') != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $gdb = "$env:RUNNER_TEMP\msys64\mingw64\bin\gdb.exe"
          foreach ($d in "tests\fixtures\nec_cw_catenary_1697\c1_icat1_sag.nec", "tests\fixtures\nec42_radius_step_1644\decks\L_step1-5_away_n20.nec") {
            python scripts/windows_static/hang_probe.py 300 $gdb $d `
              "fat=build-razor2p-fat\momwire-nec5-razor-2p-standalone.exe" `
              "one-avx2=build-razor2p-avx2\momwire-nec5-razor-2p-standalone.exe" `
              "one-sse2=build-razor2p-sse2\momwire-nec5-razor-2p-standalone.exe" `
              "bs2-fat=build-bs2-fat\momwire-nec5-bspline-standalone.exe"
          }
      # The MSVC zip of the latest green standalone.yml push run on main, for
      # the paired timing below (main's MSVC bytes; this branch changes no
      # line MSVC compiles).
      - name: the MSVC executables (standalone.yml on main)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R $env:GITHUB_REPOSITORY --workflow standalone.yml --branch main --event push --status success --limit 1 --json databaseId,headSha | ConvertFrom-Json
          "standalone.yml run $($run[0].databaseId) at $($run[0].headSha)"
          gh run download $run[0].databaseId -R $env:GITHUB_REPOSITORY -n momwire-nec5-windows-x64-SELFSIGNED-rehearsal -D msvc
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive (Get-ChildItem msvc\*.zip).FullName -DestinationPath msvc
          Get-ChildItem -Recurse msvc -Filter *.exe | Select-Object FullName, Length
      - name: indicative timing, MinGW vs MSVC (same runner, interleaved)
        if: always() && hashFiles('dist/momwire-nec5-bs2-avx2.exe') != ''
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          $M = (Resolve-Path msvc\momwire-nec5-windows-x64).Path
          $D = (Resolve-Path dist).Path
          python scripts/windows_static/time_exes.py dist/timing.jsonl `
            "mingw/razor2p=$D\momwire-nec5-razor2p-avx2.exe" "msvc/razor2p=$M\momwire-nec5-razor2p-avx2.exe" `
            "mingw/bs2=$D\momwire-nec5-bs2-avx2.exe" "msvc/bs2=$M\momwire-nec5-bs2-avx2.exe" `
            "fat/razor2p=$PWD\dist-fat\momwire-nec5-razor-2p.exe" "fat/bs2=$PWD\dist-fat\momwire-nec5-bspline.exe"
          if ($LASTEXITCODE) { exit 1 }
      # Where the MinGW build's time goes (indicative, this runner): each
      # build's own stage times (MOMWIRE_TIMES), and which libm the MinGW
      # executables call (msvcrt.dll's imports).
      - name: stage times and libm imports, MinGW vs MSVC
        if: always() && hashFiles('dist/momwire-nec5-bs2-avx2.exe') != ''
        shell: pwsh
        run: |
          $M = (Resolve-Path msvc\momwire-nec5-windows-x64).Path
          $D = (Resolve-Path dist).Path
          $env:MOMWIRE_TIMES = "1"; $env:MW_EXE_TIMES = "1"; $env:MOMWIRE_THREADS = "1"
          $decks = @("tests\fixtures\bspline_printout_buried\ab_hub16.nec", "tests\fixtures\eznec\decks\0068_nbs-yagi-ant-book-p-18-7.nec")
          foreach ($d in $decks) {
            foreach ($e in "$D\momwire-nec5-razor2p-avx2.exe", "$M\momwire-nec5-razor2p-avx2.exe", "$D\momwire-nec5-bs2-avx2.exe", "$M\momwire-nec5-bs2-avx2.exe") {
              "== $(Split-Path -Leaf $d) $e"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & $e $d "$env:RUNNER_TEMP\t.out" 2>&1 | ForEach-Object { "  $_" }
              "  wall $($sw.ElapsedMilliseconds) ms"
            }
          }
      - name: msvcrt functions the MinGW executables import
        if: always() && hashFiles('dist/momwire-nec5-bs2-avx2.exe') != ''
        shell: msys2 {0}
        run: |
          objdump -p dist/momwire-nec5-bs2-avx2.exe | awk '/DLL Name: msvcrt.dll/ {f=1; next} /DLL Name/ {f=0} f && NF >= 3 {print $NF}' | sort > msvcrt-imports.txt
          echo "$(wc -l < msvcrt-imports.txt) msvcrt.dll imports; the math ones:"
          grep -xE "_?(sin|cos|tan|exp|log|log10|pow|sqrt|hypot|atan2|atan|asin|acos|sinh|cosh|tanh|fmod|floor|ceil|_hypot|_cabs|frexp|ldexp|modf)" msvcrt-imports.txt | tr '\n' ' '; echo
          nm build-bs2-avx2/momwire-nec5-bspline-standalone.exe 2>/dev/null | grep -E " T (_?_?(sin|cos|exp|log|pow|hypot|atan2|sincos|cexp|__muldc3|__divdc3))$" | head -20
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: momwire-nec5-windows-x64-static-SELFSIGNED-rehearsal
          path: |
            dist/*.exe
            dist-fat/*.exe
            dist/imports.txt
            dist/*.jsonl
          if-no-files-found: warn
          retention-days: 7
