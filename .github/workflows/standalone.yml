# The standalone executables (standalone/, momwire#1479 and #1512): razor-2p's,
# and bs2's no-Python build beside it (momwire#1517 Phase A).
#
# `linux-artifact`: the Linux release artifact (momwire#1512),
# momwire-nec5-linux-x86_64.tar.gz -- the no-Python build
# (MW_EXE_NO_PYTHON) in avx2 and sse2 against the static OpenBLAS pinned to
# SciPy's build (standalone/build_openblas.sh), and the script that picks one
# by CPU -- built in the manylinux_2_28 image the wheels are built in
# (standalone/build_release_linux.sh: glibc 2.28 floor, libstdc++, libgcc and
# libgomp linked in), run once on AlmaLinux 8 (glibc 2.28), and uploaded as a
# workflow artifact on every run: the dry run of what a tag attaches
# (`release-linux`, pushed v* tags only). Since 0.83.0 the tarball also
# carries the NEC-4.2 slot's `momwire-nec42-sinusoidal` the same way, as a
# PREVIEW (momwire#1607), gated by `linux-nec42`.
#
# `linux`: those same bytes, gated. REQUIRED gates run on the runner: the launcher-layer contract tests
# (tests/test_standalone_nopython.py) and every fixture deck answered byte for
# byte as this environment's `momwire-nec5-razor-2p` answers it
# (scripts/core_split/exe_compare.py --standalone), at one thread, and
# SimNEC's streaming call through pipes (stream_compare.py). The full
# corpus and harvest gates stay on the fleet (they need decks the repo does
# not carry).
#
# `windows`: the hybrid build under MSVC. Its OpenBLAS is the project's own
# Windows release (a DLL, unprefixed names: MW_BLAS_PREFIX empty), which is
# NOT SciPy's Windows build, so the corpus comparison there is recorded
# rather than required: what that job requires is the build and the launcher
# contract (tests/test_standalone_exe.py). Windows identity is measured on
# the Windows builder.
#
# `windows-nopython` (momwire#1558): the no-Python builds under MSVC,
# razor-2p and bs2, avx2 and sse2, against SciPy's own OpenBLAS DLL
# (scipy-openblas32, the build SciPy's Windows wheels bundle), which ships
# beside them, delay-loaded; with the VC++ runtime and the LLVM OpenMP
# runtime beside them too, so the directory needs nothing installed. Gated:
# the launcher-layer contract tests, and every fixture deck and NX chain
# against this environment's launcher -- within PRINTOUT_RTOL_WIN32
# (exe_compare.py --rtol win32), since Windows needs no bit-compatibility.
# Built with the MSVC 14.44 toolset and signed (eznec-dropin.yml's signing
# mode: the real certificate on a tag or an azure_sign dispatch, a
# self-signed rehearsal otherwise), with a win7 folder of the sse2 builds
# carrying Microsoft's app-local UCRT, every binary through the freeze's
# Windows 7 import gate. Zipped as momwire-nec5-windows-x64.zip and attached
# to the release on a pushed tag (`release-windows`), as a PREVIEW;
# momwire-windows.zip is untouched.
#
# `macos-nopython` (momwire#1559): the no-Python builds under Apple clang on
# macos-15 arm64, razor-2p and bs2, one variant each (`legacy`, what
# setup.py's darwin branch builds), against Accelerate -- the BLAS and LAPACK
# numpy's and SciPy's macOS wheels link, reached at the same entry points
# (standalone/blas_accelerate_*.c) -- and Homebrew's libomp linked in from
# its static archive, so the executables load nothing but the system's.
# Never signed or notarised (Steve, 2026-10-18): the linker's ad-hoc
# signature, checked here. Gated as windows-nopython is: the contract tests,
# and every fixture deck and NX chain against this environment's launcher,
# within PRINTOUT_RTOL_MACOS (exe_compare.py --rtol macos). The tarball,
# momwire-nec5-macos-arm64.tar.gz, is attached to the release on a pushed
# tag (`release-macos`), as a PREVIEW.
name: standalone

on:
  # `azure_sign` proves the REAL certificate on demand, as eznec-dropin.yml's
  # does: windows-nopython then signs with it (a SIGNTEST zip, no release).
  workflow_dispatch:
    inputs:
      azure_sign:
        description: "Sign the Windows executables with the REAL Azure certificate (no tag, no release)"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - "standalone/**"
      - "src/**"
      - "scripts/core_split/exe_compare.py"
      - "scripts/core_split/printout_compare.py"
      - "scripts/core_split/stream_compare.py"
      - "scripts/core_split/nx_decks/**"
      - "scripts/core_split/nec5_bspline_printout_driver.cpp"
      - "scripts/core_split/bspline_chunked_decks/**"
      - "scripts/core_split/bspline_exact_decks/**"
      - "scripts/core_split/bs2_stream_decks/**"
      - "tests/test_standalone_*.py"
      - "tests/fixtures/**"
      - "setup.py"
      - ".github/workflows/standalone.yml"
  # A tag builds the artifact and attaches it to the release; path filters
  # do not apply to tag pushes.
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "standalone/**"
      - "src/**"
      - "scripts/core_split/exe_compare.py"
      - "scripts/core_split/printout_compare.py"
      - "scripts/core_split/stream_compare.py"
      - "scripts/core_split/nx_decks/**"
      - "scripts/core_split/nec5_bspline_printout_driver.cpp"
      - "scripts/core_split/bspline_chunked_decks/**"
      - "scripts/core_split/bspline_exact_decks/**"
      - "scripts/core_split/bs2_stream_decks/**"
      - "tests/test_standalone_*.py"
      - "tests/fixtures/**"
      - "setup.py"
      - ".github/workflows/standalone.yml"

# Every comparison here is byte for byte (or within a derived tolerance)
# between two processes, the executable and the launcher, sharing a cache
# directory across workers. The below table's sweep anchors (momwire#1471, on
# `auto` by default) make a buried sweep's current-table digits depend on
# which frequencies the seen list already holds, so the gates pin exact
# tables; the anchors themselves are gated by tests/test_below_sweep_anchors_1471.py.
env:
  MOMWIRE_BELOW_ANCHORS: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  linux-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The manylinux image's OpenBLAS (its own compiler): keyed apart from
      # the runner's, by the same script hash.
      - name: static OpenBLAS, manylinux_2_28 (cached)
        uses: actions/cache@v4
        with:
          path: ~/mwx-openblas-manylinux/libmwxp.a
          key: mwx-openblas-manylinux_2_28-${{ hashFiles('standalone/build_openblas.sh') }}
      - name: build (manylinux_2_28)
        run: |
          mkdir -p ~/mwx-openblas-manylinux dist
          docker run --rm -e MW_GLIBC_FLOOR=2.28 \
            -v "$PWD:/io" -v "$HOME/mwx-openblas-manylinux:/ob" -w /io \
            quay.io/pypa/manylinux_2_28_x86_64 \
            standalone/build_release_linux.sh /ob /io/dist
      # The floor, run rather than read: both builds and the picking script
      # answer a deck and a stream on glibc 2.28.
      - name: run on glibc 2.28 (AlmaLinux 8)
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /tmp almalinux:8 sh -ec '
            tar -xzf /io/dist/momwire-nec5-linux-x86_64.tar.gz
            cd momwire-nec5-linux-x86_64
            ldd --version | head -1
            ldd momwire-nec5-razor2p-linux-avx2
            ./momwire-nec5-razor2p-linux -version
            for v in avx2 sse2; do
              MOMWIRE_FORCE_VARIANT=$v ./momwire-nec5-razor2p-linux \
                /io/tests/fixtures/razor_printout_3a/node_gap_two_sources.nec /tmp/$v.out
              sed -n 2p /tmp/$v.out
              if grep -q "NEC ERROR" /tmp/$v.out; then exit 1; fi
            done
            ./momwire-nec5-razor2p-linux - - \
              < /io/scripts/core_split/nx_decks/simnec_stream_2281566.nec > /tmp/stream.out
            echo "stream: $(grep -c "INPUT LINE .* NX " /tmp/stream.out) structures"
            # bs2 (momwire#1517), the same checks
            ldd momwire-nec5-bs2-linux-avx2
            ./momwire-nec5-bs2-linux -version
            for v in avx2 sse2; do
              MOMWIRE_FORCE_VARIANT=$v ./momwire-nec5-bs2-linux \
                /io/tests/fixtures/razor_printout_3a/node_gap_two_sources.nec /tmp/bs2-$v.out
              sed -n 2p /tmp/bs2-$v.out
              if grep -q "NEC ERROR" /tmp/bs2-$v.out; then exit 1; fi
            done
            ./momwire-nec5-bs2-linux - - \
              < /io/scripts/core_split/nx_decks/simnec_stream_2281566.nec > /tmp/bs2-stream.out
            echo "bs2 stream: $(grep -c "INPUT LINE .* NX " /tmp/bs2-stream.out) structures"
            # the NEC-4.2 sinusoidal engine (momwire#1607, a preview):
            # a NEC-4.2 fixture deck per build, and two of them as one stream
            F=/io/tests/fixtures/eznec_nec42
            ldd momwire-nec42-sinusoidal-linux-avx2
            ./momwire-nec42-sinusoidal-linux -version
            for v in avx2 sse2; do
              MOMWIRE_FORCE_VARIANT=$v ./momwire-nec42-sinusoidal-linux \
                $F/0224_dipole-ex0.nec /tmp/nec42-$v.out
              sed -n 2p /tmp/nec42-$v.out
              if grep -q "NEC ERROR" /tmp/nec42-$v.out; then exit 1; fi
            done
            sed "s/^EN/NX/" $F/0224_dipole-ex0.nec $F/0223_dipole-ex6.nec |
              ./momwire-nec42-sinusoidal-linux - - > /tmp/nec42-stream.out
            if grep -q "NEC ERROR" /tmp/nec42-stream.out; then exit 1; fi
            n=$(grep -c "INPUT LINE .* NX " /tmp/nec42-stream.out)
            echo "nec42 stream: $n structures"
            test "$n" = 2'
      - uses: actions/upload-artifact@v7
        with:
          name: momwire-nec5-linux-x86_64
          path: dist/momwire-nec5-linux-x86_64.tar.gz
          if-no-files-found: error

  # A pushed tag only: a workflow_dispatch with a tag picked in the ref
  # dropdown also has a refs/tags/ ref, and must not replace a published
  # asset (eznec-dropin.yml's #711 guard). No release notes here: wheels.yml
  # owns the body (#662, tests/test_release_notes.py).
  release-linux:
    name: attach the Linux executable to the release
    # every executable in the tarball gated: razor-2p and bs2 by `linux`,
    # the NEC-4.2 sinusoidal preview by `linux-nec42`
    needs: [linux-artifact, linux, linux-nec42]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momwire-nec5-linux-x86_64
      - uses: softprops/action-gh-release@v3
        with:
          files: momwire-nec5-linux-x86_64.tar.gz
          fail_on_unmatched_files: true

  linux:
    needs: linux-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-py${{ steps.py.outputs.python-version }}
          save: false
      - name: momwire environment
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0" wheel pybind11
          pip install -e .[test] --no-build-isolation
        env:
          CC: ccache gcc
          CXX: ccache g++
      # The release artifact's two builds, at the paths the gates below name:
      # every gate is of the bytes a tag ships.
      - uses: actions/download-artifact@v8
        with:
          name: momwire-nec5-linux-x86_64
      - name: the release build (avx2 and sse2)
        run: |
          tar -xzf momwire-nec5-linux-x86_64.tar.gz
          R=momwire-nec5-linux-x86_64
          for v in avx2 sse2; do
            mkdir -p build-$v
            cp $R/momwire-nec5-razor2p-linux-$v build-$v/momwire-razor2p-standalone
            cp $R/momwire-nec5-bs2-linux-$v build-$v/momwire-bs2-standalone
          done
          ldd build-avx2/momwire-razor2p-standalone
      # The picking script: the build this runner's CPU runs (avx2), and the
      # forced sse2, each the very binary's bytes.
      - name: the picking script
        run: |
          R=momwire-nec5-linux-x86_64
          D=tests/fixtures/razor_printout_3a/node_gap_two_sources.nec
          test "$($R/momwire-nec5-razor2p-linux -version)" = "$(build-avx2/momwire-razor2p-standalone -version)"
          $R/momwire-nec5-razor2p-linux $D via-script.out
          build-avx2/momwire-razor2p-standalone $D direct.out
          cmp via-script.out direct.out
          MOMWIRE_FORCE_VARIANT=sse2 $R/momwire-nec5-razor2p-linux $D via-script-sse2.out
          build-sse2/momwire-razor2p-standalone $D direct-sse2.out
          cmp via-script-sse2.out direct-sse2.out
          for f in via-script.out via-script-sse2.out; do sed -n 2p $f; done
          # bs2's picking script (momwire#1517)
          $R/momwire-nec5-bs2-linux $D bs2-via-script.out
          build-avx2/momwire-bs2-standalone $D bs2-direct.out
          cmp bs2-via-script.out bs2-direct.out
          MOMWIRE_FORCE_VARIANT=sse2 $R/momwire-nec5-bs2-linux $D bs2-via-script-sse2.out
          build-sse2/momwire-bs2-standalone $D bs2-direct-sse2.out
          cmp bs2-via-script-sse2.out bs2-direct-sse2.out
      - name: contract tests
        run: pytest -q -n 0 tests/test_standalone_nopython.py -rs
        env:
          MOMWIRE_RAZOR2P_STANDALONE_EXE: ${{ github.workspace }}/build-avx2/momwire-razor2p-standalone
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: every fixture deck, as the launcher (avx2)
        run: |
          python scripts/core_split/exe_compare.py exe-linux-avx2.jsonl --standalone \
            --exe build-avx2/momwire-razor2p-standalone \
            --launcher "$(command -v momwire-nec5-razor-2p)" --workers 4 tests/fixtures
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      # The sse2 executable against the launcher on the extension's sse2
      # variant: the same code both sides.
      - name: every fixture deck, as the launcher (sse2)
        run: |
          python scripts/core_split/exe_compare.py exe-linux-sse2.jsonl --standalone \
            --exe build-sse2/momwire-razor2p-standalone \
            --launcher "$(command -v momwire-nec5-razor-2p)" --workers 4 tests/fixtures
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MOMWIRE_FORCE_VARIANT: sse2
      # The NX-chained decks (momwire#1512): Ward's 99-structure chain and its
      # cut, and SimNEC's A4 stream decks. Anchors off (the workflow's env): a
      # chain swept in frequency engages them, and their seen-state depends
      # on history.
      - name: NX chains, as the launcher (avx2, anchors off)
        run: |
          python scripts/core_split/exe_compare.py exe-linux-nx.jsonl --standalone \
            --exe build-avx2/momwire-razor2p-standalone \
            --launcher "$(command -v momwire-nec5-razor-2p)" --workers 4 \
            scripts/core_split/nx_decks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      # SimNEC's streaming call, `- -` (momwire#1512): the A4 stream decks
      # written to both engines' stdin structure by structure, each printout
      # read up to its NX echo before the next is written, and all at once;
      # byte for byte against the launcher's streaming mode, and that against
      # its own file form.
      - name: streaming call, as the launcher (avx2 and sse2, anchors off)
        run: |
          python scripts/core_split/stream_compare.py exe-linux-stream-avx2.jsonl \
            --exe build-avx2/momwire-razor2p-standalone \
            --launcher "$(command -v momwire-nec5-razor-2p)" --workers 4 \
            scripts/core_split/nx_decks/simnec_stream_*.nec
          MOMWIRE_FORCE_VARIANT=sse2 python scripts/core_split/stream_compare.py \
            exe-linux-stream-sse2.jsonl \
            --exe build-sse2/momwire-razor2p-standalone \
            --launcher "$(command -v momwire-nec5-razor-2p)" --workers 4 \
            scripts/core_split/nx_decks/simnec_stream_*.nec
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: bs2 contract tests
        run: pytest -q -n 0 tests/test_standalone_nopython.py -rs
        env:
          MOMWIRE_RAZOR2P_STANDALONE_EXE: ${{ github.workspace }}/build-avx2/momwire-bs2-standalone
          MOMWIRE_STANDALONE_BASIS: bspline
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      # The bs2 executable (momwire#1517 Phase A): every fixture deck and the
      # NX chains as `momwire-nec5-bspline` answers them, avx2 and sse2 (its
      # one static OpenBLAS standing in for both of numpy's and SciPy's), a
      # deck it does not serve refused by name; and SimNEC's streaming call.
      - name: bs2 executable, every fixture deck and the NX chains (avx2 and sse2)
        run: |
          L="$(command -v momwire-nec5-bspline)"
          python scripts/core_split/exe_compare.py exe-linux-bs2-avx2.jsonl --standalone \
            --basis bspline --exe build-avx2/momwire-bs2-standalone --launcher "$L" \
            --workers 4 tests/fixtures scripts/core_split/nx_decks \
            scripts/core_split/bs2_stream_decks
          MOMWIRE_FORCE_VARIANT=sse2 python scripts/core_split/exe_compare.py \
            exe-linux-bs2-sse2.jsonl --standalone --basis bspline \
            --exe build-sse2/momwire-bs2-standalone --launcher "$L" \
            --workers 4 tests/fixtures scripts/core_split/nx_decks \
            scripts/core_split/bs2_stream_decks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: bs2 streaming call, as the launcher (avx2 and sse2)
        run: |
          L="$(command -v momwire-nec5-bspline)"
          python scripts/core_split/stream_compare.py exe-linux-bs2-stream-avx2.jsonl \
            --exe build-avx2/momwire-bs2-standalone --launcher "$L" --workers 4 \
            scripts/core_split/bs2_stream_decks
          MOMWIRE_FORCE_VARIANT=sse2 python scripts/core_split/stream_compare.py \
            exe-linux-bs2-stream-sse2.jsonl \
            --exe build-sse2/momwire-bs2-standalone --launcher "$L" --workers 4 \
            scripts/core_split/bs2_stream_decks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      # bs2 (momwire#1517 step 1): the no-Python driver built from the core
      # TUs with the loaded variant's flags, every fixture deck and the two
      # chunked-fill decks against `_shell.render(text, basis="bspline")`,
      # printouts and each run's arrays, byte for byte.
      - name: bspline printouts, C++ alone vs python (avx2 and sse2)
        run: |
          python scripts/core_split/printout_compare.py exe-linux-bspline-avx2.jsonl \
            --basis bspline --arrays tests/fixtures scripts/core_split/bspline_chunked_decks \
            scripts/core_split/bspline_exact_decks
          MOMWIRE_FORCE_VARIANT=sse2 python scripts/core_split/printout_compare.py \
            exe-linux-bspline-sse2.jsonl --basis bspline --arrays \
            tests/fixtures scripts/core_split/bspline_chunked_decks \
            scripts/core_split/bspline_exact_decks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: exe-linux-*.jsonl
          if-no-files-found: ignore

  # `linux-nec42` (momwire#1607 B4b): the NEC-4.2 slot's
  # `momwire-nec42-sinusoidal`, shipped in the tarball as a PREVIEW. The
  # no-Python builds gated are the release artifact's own bytes (the
  # tarball's momwire-nec42-sinusoidal-linux-avx2 / -sse2, built in
  # manylinux_2_28 by linux-artifact), against this environment's launcher
  # (tests/test_standalone_nec42.py: every fixture deck and the launcher
  # layer, the measured-time lines masked), and the picking script. The
  # hybrid (its C++ route and its embedded launcher for a deck the C++
  # declines) is built on the runner against the static OpenBLAS
  # linux-artifact cached, and is not shipped. `release-linux` needs this
  # job, so a tag never attaches an nec42 build no gate ran.
  linux-nec42:
    needs: linux-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-py${{ steps.py.outputs.python-version }}
          save: false
      - name: momwire environment
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0" wheel pybind11 cmake ninja
          pip install -e .[test] --no-build-isolation
        env:
          CC: ccache gcc
          CXX: ccache g++
      - name: static OpenBLAS (linux-artifact's cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/mwx-openblas-manylinux/libmwxp.a
          key: mwx-openblas-manylinux_2_28-${{ hashFiles('standalone/build_openblas.sh') }}
          fail-on-cache-miss: true
      # The release artifact's two no-Python builds, at the paths the gates
      # below name: every no-Python gate here is of the bytes a tag ships.
      - uses: actions/download-artifact@v8
        with:
          name: momwire-nec5-linux-x86_64
      - name: the release build (avx2 and sse2)
        run: |
          tar -xzf momwire-nec5-linux-x86_64.tar.gz
          R=momwire-nec5-linux-x86_64
          for v in avx2 sse2; do
            mkdir -p build-nec42-$v
            cp $R/momwire-nec42-sinusoidal-linux-$v \
              build-nec42-$v/momwire-nec42-sinusoidal-standalone
          done
          ldd build-nec42-avx2/momwire-nec42-sinusoidal-standalone
      # The picking script: the build this runner's CPU runs (avx2), and the
      # forced sse2, each the very binary's bytes (the time lines masked).
      - name: the picking script
        run: |
          R=momwire-nec42-sinusoidal-linux
          P=momwire-nec5-linux-x86_64/$R
          B=momwire-nec42-sinusoidal-standalone
          D=tests/fixtures/eznec_nec42/0224_dipole-ex0.nec
          test "$($P -version)" = "$(build-nec42-avx2/$B -version)"
          mask() { sed -E 's/^( +FILL=).*$/\1<t>/; s/^( RUN TIME =).*$/\1<t>/' "$1"; }
          for v in avx2 sse2; do
            MOMWIRE_FORCE_VARIANT=$v $P $D via-script-$v.out
            build-nec42-$v/$B $D direct-$v.out
            cmp <(mask via-script-$v.out) <(mask direct-$v.out)
            sed -n 2p via-script-$v.out
          done
          $P $D via-script.out
          cmp <(mask via-script.out) <(mask via-script-avx2.out)
        env:
          MOMWIRE_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: build (hybrid avx2, not shipped)
        run: |
          OB=$HOME/mwx-openblas-manylinux/libmwxp.a
          cmake -S standalone -B build-nec42-hybrid -G Ninja -DMW_EXE_BASIS=sin42 \
            -DMW_EXE_VARIANT=avx2 -DMW_OPENBLAS_LIB=$OB \
            -DMW_DEFAULT_PYTHON_HOME="$(python -c 'import sys; print(sys.prefix)')" \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build-nec42-hybrid
      - name: no-Python build against the launcher (avx2)
        run: pytest -q -n 4 tests/test_standalone_nec42.py -rs
        env:
          MOMWIRE_NEC42_SIN_STANDALONE_EXE: ${{ github.workspace }}/build-nec42-avx2/momwire-nec42-sinusoidal-standalone
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: no-Python build against the launcher (sse2)
        run: pytest -q -n 4 tests/test_standalone_nec42.py -rs
        env:
          MOMWIRE_NEC42_SIN_STANDALONE_EXE: ${{ github.workspace }}/build-nec42-sse2/momwire-nec42-sinusoidal-standalone
          MOMWIRE_FORCE_VARIANT: sse2
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: the hybrid's two routes
        run: |
          E=build-nec42-hybrid/momwire-nec42-sinusoidal
          test "$($E -version)" = "$(momwire-nec42-sinusoidal -version)"
          F=tests/fixtures/eznec_nec42
          MW_EXE_ROUTE_LOG=route-cxx $E $F/0224_dipole-ex0.nec cxx.out
          MW_EXE_ROUTE_LOG=route-py $E $F/probes/p9_above_and_buried_gn2.nec fallback.out
          grep -q '^cxx:' route-cxx
          grep -q '^fallback:' route-py
          for f in cxx.out fallback.out; do
            sed -n 2p $f
            if grep -q "NEC ERROR" $f; then exit 1; fi
          done
        env:
          MOMWIRE_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"


  # `linux-nec42-sg` (momwire#1718 S4): the NEC-4.2 slot's
  # `momwire-nec42-sinusoidal-galerkin` as one no-Python executable
  # (MW_EXE_BASIS=sg42), built here from source in both variants and held to
  # the launcher by tests/test_standalone_nec42.py (every fixture deck, the
  # launcher layer, the streaming call). Not in the release tarball yet
  # (#1718 S-D), so no release job waits on it.
  linux-nec42-sg:
    needs: linux-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-py${{ steps.py.outputs.python-version }}
          save: false
      - name: momwire environment
        run: |
          pip install --upgrade pip
          pip install "setuptools>=61.0" wheel pybind11 cmake ninja
          pip install -e .[test] --no-build-isolation
        env:
          CC: ccache gcc
          CXX: ccache g++
      - name: static OpenBLAS (linux-artifact's cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/mwx-openblas-manylinux/libmwxp.a
          key: mwx-openblas-manylinux_2_28-${{ hashFiles('standalone/build_openblas.sh') }}
          fail-on-cache-miss: true
      - name: build (no-Python, avx2 and sse2)
        run: |
          OB=$HOME/mwx-openblas-manylinux/libmwxp.a
          for v in avx2 sse2; do
            cmake -S standalone -B build-nec42-sg-$v -G Ninja -DMW_EXE_NO_PYTHON=ON \
              -DMW_EXE_BASIS=sg42 -DMW_EXE_VARIANT=$v -DMW_OPENBLAS_LIB=$OB
            cmake --build build-nec42-sg-$v
          done
          ldd build-nec42-sg-avx2/momwire-nec42-sinusoidal-galerkin-standalone
        env:
          CXX: ccache g++
      - name: no-Python build against the launcher (avx2)
        run: pytest -q -n 4 tests/test_standalone_nec42.py -rs
        env:
          MOMWIRE_NEC42_SG_STANDALONE_EXE: ${{ github.workspace }}/build-nec42-sg-avx2/momwire-nec42-sinusoidal-galerkin-standalone
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: no-Python build against the launcher (sse2)
        run: pytest -q -n 4 tests/test_standalone_nec42.py -rs
        env:
          MOMWIRE_NEC42_SG_STANDALONE_EXE: ${{ github.workspace }}/build-nec42-sg-sse2/momwire-nec42-sinusoidal-galerkin-standalone
          MOMWIRE_FORCE_VARIANT: sse2
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: OpenBLAS 0.3.31 (x64 release)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.31/OpenBLAS-0.3.31-x64.zip -OutFile ob.zip
          Expand-Archive ob.zip -DestinationPath ob
          Get-ChildItem -Recurse ob -Include *.lib,*.dll | Select-Object FullName
      - name: momwire environment
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install -q -U pip setuptools wheel pybind11
          venv\Scripts\python -m pip install -q -e ".[test]"
      - name: configure + build (MSVC)
        shell: pwsh
        run: |
          $lib = (Get-ChildItem -Recurse ob -Filter libopenblas.lib | Select-Object -First 1).FullName
          cmake -S standalone -B build-exe -A x64 `
            "-DMW_OPENBLAS_LIB=$lib" "-DMW_DEFAULT_PYTHON_HOME=$PWD\venv" `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build-exe --config Release
      - name: contract tests
        shell: pwsh
        run: |
          $dll = (Get-ChildItem -Recurse ob -Filter libopenblas.dll | Select-Object -First 1).DirectoryName
          $py = Split-Path (Get-Command python).Source
          $env:PATH = "$dll;$py;$PWD\venv\Scripts;$env:PATH"
          $env:MOMWIRE_LIBPYTHON = "$py\python312.dll"
          $env:MOMWIRE_RAZOR2P_EXE = "$PWD\build-exe\Release\momwire-razor2p.exe"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_exe.py -rs
      - name: corpus slice (recorded, not required)
        continue-on-error: true
        shell: pwsh
        run: |
          $dll = (Get-ChildItem -Recurse ob -Filter libopenblas.dll | Select-Object -First 1).DirectoryName
          $py = Split-Path (Get-Command python).Source
          $env:PATH = "$dll;$py;$PWD\venv\Scripts;$env:PATH"
          $env:MOMWIRE_LIBPYTHON = "$py\python312.dll"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          venv\Scripts\python scripts/core_split/exe_compare.py exe-win.jsonl `
            --exe build-exe\Release\momwire-razor2p.exe `
            --launcher venv\Scripts\momwire-nec5-razor-2p.exe --workers 2 `
            tests/fixtures/razor_printout_3a tests/fixtures/eznec

  # The no-Python executables on Windows (momwire#1558): MSVC 14.44, razor-2p
  # and bs2, avx2 and sse2, against SciPy's OpenBLAS DLL, signed, with a
  # Windows 7 folder: the preview release asset (see the header).
  windows-nopython:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      OB_VERSION: "0.3.31.22.1"  # scipy-openblas32: the build SciPy bundles
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: SciPy's OpenBLAS (scipy-openblas32)
        shell: pwsh
        run: |
          python -m pip download -q --no-deps --only-binary=:all: "scipy-openblas32==$env:OB_VERSION" -d obwhl
          python -m zipfile -e (Get-ChildItem obwhl\*.whl).FullName ob
          Get-Item ob\scipy_openblas32\lib\libscipy_openblas.dll | Select-Object FullName, Length
      # The Python reference the gates compare with: the user's own momwire,
      # built by whatever toolset setuptools finds, as a pip install is.
      - name: momwire environment
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install -q -U pip setuptools wheel pybind11
          venv\Scripts\python -m pip install -q -e ".[test]"
      # EVERY executable is built with the MSVC 14.44 toolset, as
      # eznec-dropin.yml's Win7 leg is: from 14.5x on, MSVCP140.dll imports
      # CopyFile2, CreateFile2 and GetSystemTimePreciseAsFileTime, none of
      # which Windows 7 has (that leg's run 38427318212 failed its import gate
      # on exactly that), and a runtime older than the toolset that compiled
      # the code is unsupported. One toolset for all four builds, so the
      # Windows 7 folder's sse2 programs are the very sse2 builds the gates
      # below run. Ninja, so the build takes the compiler this puts on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'
      - name: configure + build (MSVC 14.44, four executables)
        shell: pwsh
        run: |
          python -m pip install -q ninja
          $banner = (cmd /c "cl 2>&1" | Select-Object -First 1)
          $banner
          if ($banner -notmatch 'Version 19\.44\.') { throw "cl is not the 14.44 toolset: $banner" }
          $dll = "$PWD\ob\scipy_openblas32\lib\libscipy_openblas.dll"
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2') {
              cmake -S standalone -B "build-$b-$v" -G Ninja -DCMAKE_BUILD_TYPE=Release -DMW_EXE_NO_PYTHON=ON `
                "-DMW_EXE_BASIS=$b" "-DMW_EXE_VARIANT=$v" "-DMW_OPENBLAS_LIB=$dll" -DMW_BLAS_PREFIX=scipy_
              if ($LASTEXITCODE) { exit 1 }
              cmake --build "build-$b-$v"
              if ($LASTEXITCODE) { exit 1 }
            }
          }
      # THE SIGNING MODE, decided once, as eznec-dropin.yml decides it (#711;
      # that file says why each step is the way it is):
      #
      #   azure     -- pushed tags and azure_sign dispatches: the real
      #                certificate, its chain checked as a hard gate.
      #   rehearsal -- every other run: self-signed, chain check waived, and
      #                never on a tag.
      #
      # No unsigned mode on any CI path.
      - name: Decide the signing mode
        shell: pwsh
        env:
          AZURE_SIGN: ${{ inputs.azure_sign }}
        run: |
          $mode = if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:AZURE_SIGN -eq 'true') { 'azure' } else { 'rehearsal' }
          "MOMWIRE_SIGN_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rehearsal signing certificate (self-signed, never on tags)
        if: env.MOMWIRE_SIGN_MODE == 'rehearsal'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=momwire standalone rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          "MOMWIRE_SIGN_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOMWIRE_SIGN_ALLOW_UNTRUSTED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOMWIRE_SIGN_TIMESTAMP_URL=http://timestamp.acs.microsoft.com" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # .NET 8 for the Artifact Signing dlib, which runs on the .NET 8 runtime
      # (nuget.exe below fetches the dlib itself, so no SDK is needed). Not
      # actions/setup-dotnet: its installer reads dotnetorigin.blob.core.
      # windows.net, which answers HTTP 409 since 2026-10-25 while Microsoft's
      # current host, builds.dotnet.microsoft.com, serves the same files. The
      # runner's own .NET 8 is used when it has one.
      - name: .NET 8 runtime (the runner's, else Microsoft's current host)
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $have = @(& dotnet --list-runtimes 2>$null) -match '^Microsoft\.NETCore\.App 8\.'
          if ($have) { $have; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -Uri https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -OutFile $script
          & $script -Channel 8.0 -Runtime dotnet -InstallDir $dir -AzureFeed https://builds.dotnet.microsoft.com/dotnet
          if (-not (Test-Path (Join-Path $dir 'dotnet.exe'))) { throw ".NET 8 runtime did not install to $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the Artifact Signing dlib (azure mode)
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
          & ./nuget.exe install Microsoft.ArtifactSigning.Client -Version 1.0.128 -x -OutputDirectory packages
          $dlib = Get-ChildItem packages -Recurse -Filter Azure.CodeSigning.Dlib.dll |
                  Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found in Microsoft.ArtifactSigning.Client" }
          "MOMWIRE_SIGN_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Write the Artifact Signing metadata (azure mode)
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        shell: pwsh
        run: |
          $meta = [ordered]@{
            Endpoint               = "https://wus2.codesigning.azure.net"
            CodeSigningAccountName = "momwire"
            CertificateProfileName = "momwire-public-trust"
            ExcludeCredentials     = @(
              "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential",
              "VisualStudioCodeCredential", "AzureCliCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential")
          }
          $meta | ConvertTo-Json | Out-File metadata.json -Encoding utf8
          "MOMWIRE_SIGN_METADATA=$((Resolve-Path metadata.json).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOMWIRE_SIGN_TIMESTAMP_URL=http://timestamp.acs.microsoft.com" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Before staging, so every copy carries the signature and every gate
      # below runs signed bytes. The AZURE_* credentials exist in azure mode
      # only, as in eznec-dropin.yml.
      - name: sign the four executables
        env:
          AZURE_TENANT_ID: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: >-
          python standalone/sign_windows.py
          build-razor2p-avx2/momwire-razor2p-standalone.exe build-razor2p-sse2/momwire-razor2p-standalone.exe
          build-bs2-avx2/momwire-bs2-standalone.exe build-bs2-sse2/momwire-bs2-standalone.exe
      # The zip's tree: the four programs under their release names with the
      # DLLs they load beside them -- SciPy's OpenBLAS, the 14.44 toolset's own
      # VC++ runtime and LLVM's OpenMP runtime (the System32 copy, as
      # scripts/eznec_freeze/build.py bundles it, and as that freeze's Win7 leg
      # ships it through the same import gate) -- and win7\, the two sse2
      # programs with the same DLLs plus Microsoft's app-local Universal C
      # Runtime from the Windows SDK (on Windows 10 and 11 the system's own
      # copy wins, so it is harmless there).
      - name: stage
        shell: pwsh
        run: |
          $D = "dist\momwire-nec5-windows-x64"
          $W7 = "$D\win7"
          New-Item -ItemType Directory -Force $W7 | Out-Null
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2') {
              Copy-Item "build-$b-$v\momwire-$b-standalone.exe" "$D\momwire-nec5-$b-$v.exe"
            }
            Copy-Item "build-$b-sse2\momwire-$b-standalone.exe" "$W7\momwire-nec5-$b-sse2.exe"
          }
          $crt = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $ucrt = Join-Path $env:UniversalCRTSdkDir "Redist\$($env:UCRTVersion)\ucrt\DLLs\x64"
          if (-not (Test-Path "$ucrt\ucrtbase.dll")) {
            $ucrt = (Get-ChildItem "$env:UniversalCRTSdkDir\Redist\*\ucrt\DLLs\x64\ucrtbase.dll" | Sort-Object FullName | Select-Object -Last 1).DirectoryName
          }
          "VC++ runtime: $crt"; "app-local UCRT: $ucrt"
          foreach ($dir in $D, $W7) {
            Copy-Item ob\scipy_openblas32\lib\libscipy_openblas.dll $dir
            foreach ($f in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { Copy-Item "$crt\$f" $dir }
            Copy-Item "$env:SystemRoot\System32\libomp140.x86_64.dll" $dir
          }
          Copy-Item "$ucrt\*.dll" $W7
          Copy-Item standalone\release\README-windows.txt "$D\README.txt"
          Get-ChildItem -Recurse $D | Select-Object FullName, Length, @{n='version';e={$_.VersionInfo.FileVersion}}
      # Windows 7: no runner can run it, so the only check is the one the
      # freeze's Win7 leg uses -- every PE file's import and delay-import
      # tables against what Windows 7 SP1 provides (curated; see the script).
      - name: Windows 7 import gate (every binary in the zip)
        shell: pwsh
        run: |
          python -m pip install -q pefile
          python scripts/eznec_freeze/scan_win7_imports.py dist\momwire-nec5-windows-x64
          if ($LASTEXITCODE) { exit 1 }
      # Each program carries the signature, the win7 copies included; in azure
      # mode the chain must verify (sign.py checked the built files already).
      - name: signatures in the staged tree
        shell: pwsh
        run: |
          foreach ($e in Get-ChildItem -Recurse dist\momwire-nec5-windows-x64 -Filter *.exe) {
            $s = Get-AuthenticodeSignature $e.FullName
            "$($e.FullName): $($s.Status) $($s.SignerCertificate.Subject)"
            if (-not $s.SignerCertificate) { throw "$($e.Name) is not signed" }
            if ($env:MOMWIRE_SIGN_MODE -eq 'azure' -and $s.Status -ne 'Valid') { throw "$($e.Name): $($s.Status)" }
          }
      # The tree alone: a PATH of System32 only, so each program finds every
      # DLL it needs beside it; a deck and a SimNEC stream each.
      - name: run from the staged tree
        shell: pwsh
        run: |
          $D = (Resolve-Path dist\momwire-nec5-windows-x64).Path
          $deck = "$PWD\tests\fixtures\razor_printout_3a\node_gap_two_sources.nec"
          $stream = "$PWD\scripts\core_split\nx_decks\simnec_stream_2281566.nec"
          $env:PATH = "$env:SystemRoot\System32"
          foreach ($e in Get-ChildItem -Recurse $D -Filter *.exe) {
            & $e.FullName -version
            $out = "$env:RUNNER_TEMP\$($e.Directory.Name)-$($e.BaseName).out"
            & $e.FullName $deck $out
            if ($LASTEXITCODE) { exit 1 }
            "$($e.Directory.Name)\$($e.Name): $((Get-Content $out)[1])"
            if (Select-String -Quiet "NEC ERROR" $out) { exit 1 }
            cmd /c "`"$($e.FullName)`" - - < `"$stream`" > `"$out.stream`""
            if ($LASTEXITCODE) { exit 1 }
            $n = (Select-String -Pattern 'INPUT LINE .* NX ' "$out.stream").Count
            "  stream: $n structures"
            if ($n -lt 1) { exit 1 }
          }
      - name: contract tests (razor-2p and bs2)
        shell: pwsh
        run: |
          $D = (Resolve-Path dist\momwire-nec5-windows-x64).Path
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = "$D\momwire-nec5-razor2p-avx2.exe"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
          $env:MOMWIRE_RAZOR2P_STANDALONE_EXE = "$D\momwire-nec5-bs2-avx2.exe"
          $env:MOMWIRE_STANDALONE_BASIS = "bspline"
          venv\Scripts\python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          if ($LASTEXITCODE) { exit 1 }
      # Every fixture deck and the NX chains, as the launcher answers them,
      # within PRINTOUT_RTOL_WIN32; a deck a build does not serve refused by
      # name. sse2 against the launcher on the extension's sse2 variant.
      - name: every fixture deck and the NX chains (razor-2p and bs2, avx2 and sse2)
        shell: pwsh
        run: |
          $D = (Resolve-Path dist\momwire-nec5-windows-x64).Path
          $env:PATH = "$PWD\venv\Scripts;$env:PATH"
          $env:OPENBLAS_NUM_THREADS = "1"; $env:OMP_NUM_THREADS = "1"
          $fail = 0
          foreach ($b in 'razor2p', 'bs2') {
            foreach ($v in 'avx2', 'sse2') {
              if ($v -eq 'sse2') { $env:MOMWIRE_FORCE_VARIANT = 'sse2' } else { Remove-Item Env:MOMWIRE_FORCE_VARIANT -ErrorAction Ignore }
              $extra = @()
              $L = "$PWD\venv\Scripts\momwire-nec5-razor-2p.exe"
              if ($b -eq 'bs2') { $extra = @('--basis', 'bspline', 'scripts/core_split/bs2_stream_decks'); $L = "$PWD\venv\Scripts\momwire-nec5-bspline.exe" }
              "=== $b $v"
              venv\Scripts\python scripts/core_split/exe_compare.py "exe-win-$b-$v.jsonl" --standalone --rtol win32 `
                --exe "$D\momwire-nec5-$b-$v.exe" --launcher $L --workers 4 @extra tests/fixtures scripts/core_split/nx_decks
              if ($LASTEXITCODE) { $fail = 1 }
            }
          }
          exit $fail
      - name: upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: exe-win-*.jsonl
          if-no-files-found: ignore
      # The name rides on the ZIP FILE, as eznec-dropin.yml's does: canonical
      # only on a pushed tag; a dispatch with the real certificate is a
      # SIGNTEST, and every other run a SELFSIGNED-rehearsal, so an unzipped
      # run artifact can never pass for a release download.
      - name: name and zip
        shell: pwsh
        run: |
          $stem = 'momwire-nec5-windows-x64'
          $base = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_EVENT_NAME -eq 'push') { $stem }
                  elseif ($env:MOMWIRE_SIGN_MODE -eq 'azure') { "$stem-SIGNTEST" }
                  else { "$stem-SELFSIGNED-rehearsal" }
          "BUNDLE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path dist\momwire-nec5-windows-x64 -DestinationPath "dist\$base.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: dist/${{ env.BUNDLE }}.zip
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  # The Windows zip, on a pushed tag only (release-linux's guard), and only
  # from a green windows-nopython: the build, the Win7 import gate, the
  # signatures and every gate above are that job.
  release-windows:
    name: attach the Windows executables to the release (preview)
    needs: windows-nopython
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momwire-nec5-windows-x64
      - uses: softprops/action-gh-release@v3
        with:
          files: momwire-nec5-windows-x64.zip
          fail_on_unmatched_files: true

  macos-nopython:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup.py's darwin branch links the same keg (LIBOMP_PREFIX)
      - name: libomp
        run: |
          brew install libomp
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: momwire environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install -q -U pip setuptools wheel pybind11
          venv/bin/python -m pip install -q -e ".[test]"
          # the library the executables follow: Accelerate, in both
          venv/bin/python -c "import numpy, scipy, momwire; numpy.show_config(); scipy.show_config(); print('variant', momwire.accelerator_variant)"
      - name: configure + build (Apple clang, two executables)
        run: |
          for b in razor2p bs2; do
            cmake -S standalone -B build-$b -DMW_EXE_NO_PYTHON=ON -DMW_EXE_BASIS=$b -DCMAKE_BUILD_TYPE=Release
            cmake --build build-$b -j 3
          done
      # Every Mach-O file in the directory: what it loads (the system's
      # libraries only) and its signature (the linker's ad-hoc one; nothing
      # here signs or notarises).
      - name: stage
        run: |
          D=dist/momwire-nec5-macos-arm64
          mkdir -p $D
          cp build-razor2p/momwire-razor2p-standalone $D/momwire-nec5-razor2p-macos
          cp build-bs2/momwire-bs2-standalone $D/momwire-nec5-bs2-macos
          cp standalone/release/README-macos.txt $D/README.txt
          for f in $D/*; do
            file -b "$f" | grep -q Mach-O || continue
            echo "== $f"
            otool -L "$f"
            if otool -L "$f" | tail -n +2 | grep -v -E "^[[:space:]]*(/System/Library/|/usr/lib/)"; then
              echo "::error::$f loads a library outside the system's"; exit 1
            fi
            codesign -dv "$f" 2>&1
            codesign -dv "$f" 2>&1 | grep -q "Signature=adhoc" || { echo "::error::$f has no ad-hoc signature"; exit 1; }
            codesign -v "$f"
          done
          tar -C dist -czf dist/momwire-nec5-macos-arm64.tar.gz momwire-nec5-macos-arm64
      # The tarball as a user unpacks it (README-macos.txt's steps)
      - name: run from the unpacked tarball
        run: |
          mkdir -p "$RUNNER_TEMP/u" && tar -C "$RUNNER_TEMP/u" -xzf dist/momwire-nec5-macos-arm64.tar.gz
          D="$RUNNER_TEMP/u/momwire-nec5-macos-arm64"
          for e in "$D"/momwire-nec5-*-macos; do
            "$e" -version
            "$e" tests/fixtures/razor_printout_3a/node_gap_two_sources.nec "$RUNNER_TEMP/$(basename $e).out"
            sed -n 2p "$RUNNER_TEMP/$(basename $e).out"
            if grep -q "NEC ERROR" "$RUNNER_TEMP/$(basename $e).out"; then exit 1; fi
            "$e" - - < scripts/core_split/nx_decks/simnec_stream_2281566.nec > "$RUNNER_TEMP/stream.out"
            echo "stream: $(grep -c "INPUT LINE .* NX " "$RUNNER_TEMP/stream.out") structures"
          done
      - name: contract tests (razor-2p and bs2)
        run: |
          D=$PWD/dist/momwire-nec5-macos-arm64
          export PATH=$PWD/venv/bin:$PATH OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          MOMWIRE_RAZOR2P_STANDALONE_EXE=$D/momwire-nec5-razor2p-macos venv/bin/python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
          MOMWIRE_RAZOR2P_STANDALONE_EXE=$D/momwire-nec5-bs2-macos MOMWIRE_STANDALONE_BASIS=bspline \
            venv/bin/python -m pytest -q -n 0 tests/test_standalone_nopython.py -rs
      # Every fixture deck and the NX chains, as the launcher answers them,
      # within PRINTOUT_RTOL_MACOS; a deck a build does not serve refused by
      # name.
      - name: every fixture deck and the NX chains (razor-2p and bs2)
        run: |
          D=$PWD/dist/momwire-nec5-macos-arm64
          export PATH=$PWD/venv/bin:$PATH OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          fail=0
          for b in razor2p bs2; do
            extra=""; L=$PWD/venv/bin/momwire-nec5-razor-2p
            if [ $b = bs2 ]; then extra="--basis bspline scripts/core_split/bs2_stream_decks"; L=$PWD/venv/bin/momwire-nec5-bspline; fi
            echo "=== $b"
            venv/bin/python scripts/core_split/exe_compare.py exe-mac-$b.jsonl --standalone --rtol macos \
              --exe $D/momwire-nec5-$b-macos --launcher $L --workers 3 $extra tests/fixtures scripts/core_split/nx_decks || fail=1
          done
          exit $fail
      - name: upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: exe-mac-*.jsonl
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: momwire-nec5-macos-arm64
          path: dist/momwire-nec5-macos-arm64.tar.gz
          if-no-files-found: error

  # The macOS tarball, on a pushed tag only, from a green macos-nopython
  # (its gates are that job). Ad-hoc signed only, as decided (the header).
  release-macos:
    name: attach the macOS executables to the release (preview)
    needs: macos-nopython
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momwire-nec5-macos-arm64
      - uses: softprops/action-gh-release@v3
        with:
          files: momwire-nec5-macos-arm64.tar.gz
          fail_on_unmatched_files: true
