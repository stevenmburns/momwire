name: eznec-dropin

# Build the packaged Windows executable for EZNEC's external-engine slot:
# momwire.eznec frozen with PyInstaller (one-dir — one-file is disqualified,
# it self-extracts on every launch and EZNEC launches once per frequency
# point; sitting-4 measured 17 s vs 1.3 s), smoke-gated byte-for-byte against
# the unfrozen module, zipped, and attached to the GitHub Release on tags.
#
# The zip keeps a version-less name (momwire-eznec-windows.zip) so
# .../releases/latest/download/momwire-eznec-windows.zip is a stable link —
# the site's reference/eznec-nec5 page points there.
#
# Triggers mirror wheels.yml: push to main is the post-merge canary (freeze
# breakage is Windows/PyInstaller-specific, invisible to per-PR Linux CI),
# tags attach the artifact, workflow_dispatch is the pre-merge escape hatch.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  # `azure_sign` exists so the REAL certificate can be proven on demand.
  # Without it the Azure path's first execution would be a tag build, i.e.
  # mid-release, with a GitHub Release already created and artifacts half
  # attached. A dispatch costs nothing and is freely repeatable.
  workflow_dispatch:
    inputs:
      azure_sign:
        description: "Sign with the REAL Azure certificate (no tag, no release)"
        type: boolean
        default: false

# Superseded main-push builds cancel; tag refs are unique groups, so a
# release build can never be cancelled (the wheels.yml #220 rule).
concurrency:
  group: eznec-dropin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The canary exists for changes that can REACH the frozen bundle; a docs-
  # or site-only merge cannot, and used to pay a Windows freeze + smoke to
  # prove it. Anything that is NOT a branch push — a tag, a dispatch —
  # hard-passes through the `|| 'true'` fallback: the release build rides
  # tags and must never hinge on a diff a filter might fail to compute.
  # Keep the filter identical to ci.yml's `changes` job. Note build.py and
  # entry.py stay INSIDE the filter (only probes and prose are outside):
  # this lane is their gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!site/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!scripts/probe_*.py'

  freeze:
    name: freeze + smoke (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # python -m pip: on Windows pip.exe refuses to replace itself in-place.
      - run: python -m pip install --upgrade pip
      # Install momwire from this checkout (builds the MSVC accelerator, same
      # toolchain path the wheels take) plus the freezer.
      - run: pip install . "pyinstaller>=6.10,<7"
      # THE MODE, decided exactly once. Every signing step below, the secrets
      # scope on the build step, the bundle name, and build.py's own
      # post-condition (sign.py must have signed when the mode says signing
      # happens) key off this one value. Before this step existed the same
      # decision lived in five hand-complementary predicates, and the #711
      # retro-review showed one mis-edited copy could produce a GREEN,
      # canonically-named, UNSIGNED tag build with no detector.
      #
      #   azure     -- tags and azure_sign dispatches: the real certificate,
      #                chain check as a HARD gate (ALLOW_UNTRUSTED never set).
      #   rehearsal -- every other CI build: self-signed, chain check waived.
      #
      # There is deliberately NO unsigned mode on any CI path; local dev
      # builds outside CI stay unsigned because neither identity variable is
      # set there, and that is the one legitimate unsigned route.
      - name: Decide the signing mode
        shell: pwsh
        env:
          AZURE_SIGN: ${{ inputs.azure_sign }}
        run: |
          $mode = if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:AZURE_SIGN -eq 'true') { 'azure' } else { 'rehearsal' }
          "MOMWIRE_SIGN_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Self-signed REHEARSAL signing: exercises the whole signing path --
      # signtool discovery, sign-before-copy, the copy-inherits-signature
      # assertion, and a smoke gate running against signed bytes -- with no
      # certificate and no money. MOMWIRE_SIGN_ALLOW_UNTRUSTED is what makes
      # it passable at all: a self-signed cert cannot chain to a trusted root,
      # so `signtool verify /pa` must fail here by construction.
      #
      # NEVER ON A TAG, deliberately: a self-signed signature on a public
      # release is WORSE than none (users see "Unknown Publisher" either way,
      # and an untrusted-root signature reads as tampering to some AV
      # heuristics). Tags take the REAL Azure path below -- since #711 a tag
      # build hard-requires working Azure signing and there is no unsigned
      # fallback; that trade is deliberate, and the failure mode (expired
      # client secret, Azure/TSA outage => red freeze job, no zip attached)
      # is documented in docs/code-signing.md alongside the rotation ritual.
      #
      # The rehearsal timestamps against the SAME TSA the release path uses,
      # on purpose: a canary that goes red on that endpoint is news about the
      # next release, not DigiCert-shaped noise (#711 retro-review).
      - name: Rehearsal signing certificate (self-signed, never on tags)
        if: env.MOMWIRE_SIGN_MODE == 'rehearsal'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=momwire eznec rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          "MOMWIRE_SIGN_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOMWIRE_SIGN_ALLOW_UNTRUSTED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOMWIRE_SIGN_TIMESTAMP_URL=http://timestamp.acs.microsoft.com" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # REAL signing -- Azure Artifact Signing.
      #
      # The key never leaves Azure, so there is no thumbprint and nothing in
      # the local store: signtool reaches it through a dlib plus a metadata
      # file naming the account, profile and region.
      #
      # The dlib comes from NuGet and .NET 8 from setup-dotnet, deliberately
      # NOT from Microsoft's ArtifactSigningClientTools.msi. The MSI bundles
      # both and reads like the simpler option, but `msiexec /quiet` HUNG for
      # nine minutes on windows-latest (run 33229631979) with no output and
      # no failure -- it wants an interactive installer context the runner
      # does not give it. Two explicit dependencies that complete in seconds
      # beat one bundled dependency that stalls silently.
      - uses: actions/setup-dotnet@v6
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        with:
          dotnet-version: '8.0'
      - name: Install the Artifact Signing dlib (azure mode)
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        shell: pwsh
        # Fail fast rather than stall to the job's 30-minute ceiling, which
        # is how the MSI attempt burned ten minutes saying nothing.
        #
        # The -Version pin: this chain runs at TAG TIME, on the release
        # critical path, so a floating 'latest' would let an upstream package
        # restructure (or registry outage) block a release. 1.0.128 is the
        # version the 2026-08-29 azure_sign dispatches proved end-to-end;
        # bump it deliberately, re-proving with a dispatch first.
        timeout-minutes: 5
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
          & ./nuget.exe install Microsoft.ArtifactSigning.Client -Version 1.0.128 -x -OutputDirectory packages
          $dlib = Get-ChildItem packages -Recurse -Filter Azure.CodeSigning.Dlib.dll |
                  Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found in Microsoft.ArtifactSigning.Client" }
          "MOMWIRE_SIGN_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Write the Artifact Signing metadata (azure mode)
        if: env.MOMWIRE_SIGN_MODE == 'azure'
        shell: pwsh
        run: |
          # Endpoint MUST match the region the account and profile live in.
          # A mismatch surfaces as 403 plus a SignerSign() failure, saying
          # nothing whatsoever about regions.
          #
          # ExcludeCredentials pins DefaultAzureCredential to the three
          # AZURE_* variables below. Left unpinned it tries managed identity
          # and the Azure CLI first, which on a hosted runner is latency at
          # best and a cached-credential 400 at worst.
          $meta = [ordered]@{
            Endpoint               = "https://wus2.codesigning.azure.net"
            CodeSigningAccountName = "momwire"
            CertificateProfileName = "momwire-public-trust"
            ExcludeCredentials     = @(
              "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential",
              "VisualStudioCodeCredential", "AzureCliCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential")
          }
          $meta | ConvertTo-Json | Out-File metadata.json -Encoding utf8
          "MOMWIRE_SIGN_METADATA=$((Resolve-Path metadata.json).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Microsoft's own TSA. Artifact Signing certificates are valid for
          # THREE DAYS, so the timestamp is not hygiene here -- it is the
          # only thing keeping shipped signatures valid past this week.
          "MOMWIRE_SIGN_TIMESTAMP_URL=http://timestamp.acs.microsoft.com" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Signs per MOMWIRE_SIGN_MODE: Azure identity in azure mode, the
      # self-signed rehearsal otherwise — and build.py FAILS if the mode
      # promised a signature and none got attached, so a half-configured
      # environment can never ship a green unsigned bundle.
      # MOMWIRE_SIGN_ALLOW_UNTRUSTED is set only by the rehearsal step, so
      # azure mode gets the chain check as a HARD gate, for free.
      #
      # The AZURE_* credentials are scoped to azure mode: a rehearsal canary
      # runs the freezer (PyInstaller + this checkout's code) with EMPTY
      # strings here, so ~every merge to main stops carrying a live
      # code-signing credential it can never use (#711 retro-review).
      - run: python scripts/eznec_freeze/build.py
        env:
          AZURE_TENANT_ID: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.MOMWIRE_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
      # The gate: frozen exe vs `python -m momwire.eznec`, byte-identical on
      # serving decks (CRLF included), refusal frame present on a refused one,
      # and every variant build.py shipped present beside it and SERVING the
      # basis its filename names (momwire#593). This is the only lane that
      # runs the drop-in as a program at all, so the filename mechanism is
      # gated here or nowhere.
      - run: python scripts/eznec_freeze/smoke.py dist/momwire-eznec/momwire-eznec.exe
      # One name, computed once, used by the zip, the upload, and (on tags)
      # the release job's download. A tag keeps the canonical name the
      # release job asks for by name; anything else is a rehearsal build and
      # says so.
      #
      # The name is carried by the ZIP FILE and not only by the artifact,
      # because the artifact name exists solely in the Actions UI: download
      # it and what lands on disk is the inner zip. If only the artifact were
      # renamed, an unzipped rehearsal bundle would be indistinguishable from
      # a release download at exactly the moment someone runs the exe. The
      # repo is public, so run artifacts are downloadable by anyone -- the
      # name is the only thing standing between a passer-by and a
      # self-signed binary that looks official.
      # The canonical literal `momwire-eznec-windows` also appears in the
      # release job below (download name + files:) — deliberately NOT plumbed
      # through a job output: tests/test_release_notes.py pins the release
      # job's literal as the public download contract, so the three sites
      # cannot drift without a red test.
      #
      # Canonical requires ref_type == tag AND a push event: a dispatch run
      # ON a tag ref is a signing test, not a release build, and must not
      # produce release-look-alike bytes (#711 retro-review).
      - name: Name the bundle
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_EVENT_NAME -eq 'push') { 'momwire-eznec-windows' }
                  elseif ($env:MOMWIRE_SIGN_MODE -eq 'azure') { 'momwire-eznec-windows-SIGNTEST' }
                  else { 'momwire-eznec-windows-SELFSIGNED-rehearsal' }
          "BUNDLE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Zip the bundle
        shell: pwsh
        run: Compress-Archive -Path dist/momwire-eznec -DestinationPath "$env:BUNDLE.zip"
      # Rehearsal bundles expire in a week: they exist to be fetched off a
      # test run while that run is topical, not to accumulate a 90-day shelf
      # of self-signed executables.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.zip
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  release:
    # Attach the zip to the same GitHub Release wheels.yml creates. Both
    # workflows use softprops/action-gh-release, which updates an existing
    # release rather than clobbering it; if the two runs race on CREATING the
    # release for a fresh tag, re-run this job.
    name: attach drop-in to release
    needs: freeze
    # The event guard enforces what the azure_sign input's description
    # promises ("no tag, no release"): a workflow_dispatch run with a tag
    # picked in the ref dropdown also satisfies startsWith(refs/tags/), and
    # without the guard it would silently REPLACE the published release
    # asset (#711 retro-review). Only a pushed tag releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momwire-eznec-windows
      - uses: softprops/action-gh-release@v3
        with:
          # NO generate_release_notes here, and that asymmetry is the point:
          # wheels.yml's release job owns the body, this one owns the zip.
          #
          # Both jobs used to ask, on the theory that notes come from whichever
          # job CREATES the release. They don't. The action passes the EXISTING
          # body back on an update, and GitHub pre-pends that body to the notes
          # it generates — so the second job to run appended a second copy of
          # the changelog. Every release from v0.37.0 through v0.40.0 shipped
          # doubled (#662); v0.40.0's was hand-fixed after the fact.
          #
          # One asker is correct in BOTH orderings, including the race the old
          # comment worried about:
          #   wheels first  -> it creates the body; this job updates with no
          #                    body input, and the action preserves what is
          #                    there.
          #   this job first -> it creates the release bodyless; wheels then
          #                    updates, and the same pre-pend mechanism runs
          #                    against an EMPTY body, which is just the notes.
          files: momwire-eznec-windows.zip
