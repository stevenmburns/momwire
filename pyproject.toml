[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "momwire"
version = "0.33.0"
authors = [
  { name="Steven M. Burns", email="smburns47@gmail.com" },
]
description = "A pure-Python method-of-moments antenna simulator with optional C++ accelerators"
readme = "README.md"
requires-python = ">=3.10"  # matches the wheel floor (cp310+); module-level
# PEP 585 generics (bspline._V_UNIT_INV) break import below 3.9 anyway (#221)
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    # Accelerated wheels are built for these three; other platforms fall back to
    # the pure-Python solver (the C++ extension is an optional build). Not "OS
    # Independent" — that connotes a pure-Python package, which this isn't.
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
# Core runtime deps: the solver and its helpers import these unconditionally
# (numpy/scipy throughout src/momwire). The C++ _accelerators extension is an
# optional speedup, not required for import.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Test/dev flow: `pip install -e .[test]` reproduces the suite. numpy/scipy are
# core deps; these are the extra imports the tests use (matplotlib for the
# figure scripts, scikit-rf for the network tests) plus the runner. The
# PyNEC cross-check (tests/test_pynec_backend.py) additionally needs PyNEC,
# installed separately from the python-necpp fork's wheel — see README — and
# those tests skip cleanly without it, so it stays out of this list (it's a
# platform-specific --find-links wheel, not a PyPI package a name could pin).
test = [
    "pytest",
    # xdist is the DEFAULT lane since #403 closed (see the addopts note).
    # History, because both halves were hard-won: #400's first evaluation
    # measured `-n auto` at 486 s against the serial 280 s — each worker
    # spawned a full-width OpenMP pool (the accelerator is built -fopenmp)
    # and the BLAS/OMP-heavy tests serialized behind thread contention.
    # tests/conftest.py fixed that with a per-worker OMP/OpenBLAS pin plus
    # portal/memgate xdist groups (the group markers need tryfirst, see
    # conftest). Then #403 fixed the four order-sensitive portal exactness
    # failures (the pattern table printed the magnitude-and-angle of
    # numerical zero, which moved with process history under load; the
    # components are floored at NEC's own _FIELD_FLOOR2 since). Measured
    # after both: ~2m00s, 3710 green.
    "pytest-xdist",
    "matplotlib",
    "scikit-rf",
]
# Optional third-party MoM solvers used by the comparator scripts in
# scripts/. (PyNEC is installed separately from the python-necpp fork's
# release wheel — see README — not from PyPI.)
validation = [
    "pymininec>=1.2",
]

# Console scripts.
#
# `momwire-nec2c` is the SimNEC portal daemon (momwire.portal, issue #846
# phase III) — momwire standing in for the nec2c binary SimNEC shells out to,
# and momwire's only executable front door. The NAME IS PART OF THE CONTRACT
# and must not be "prettified": `nec2/NEC2PortalDialog` accepts a configured
# engine only if the executable's FILENAME, lowercased, CONTAINS the substring
# "nec2c" (the same check picks NEC5/NEC4.2 dialects off "nec5"/"nec42", so a
# name containing one of those instead would select the wrong column layout).
# A user points the portal dialog at `<venv>/bin/momwire-nec2c`; renaming it
# to, say, `momwire-portal` makes SimNEC silently refuse the engine with
# "NO NEC Command Available".
#
# SimNEC then probes `<cmd> -version` and matches the first line against
# `nec2c\.ae6ty\.(.*)` — see momwire.portal PROBE_VERSION for why that tail
# has to be a bare one-dot number — and afterwards runs the command through
# `sh -c` with cwd=$HOME, so the entry point must never depend on the working
# directory. Both properties are pinned in tests/test_portal.py.
#
# `momwire-nec2c-shared` (issue #379) is the OPT-IN sibling: a thin, stdlib-only
# forwarder to one long-lived server process, for a session where SimNEC's
# spawn-per-evaluation-burst behaviour makes the cold start (Python + NumPy +
# parse + mesh + first fill) the dominant cost. It must NOT resolve into
# `momwire.portal` — importing the package is the ~680 ms it exists to delete —
# so it lives in its own top-level module with no momwire import in it, and the
# `py_modules` entry in setup.py is what ships it. The name obeys the same two
# filename rules as its stock sibling: it CONTAINS `nec2c` and it contains no
# `out`, `nec5` or `nec42`. Both entries are pinned in tests/test_portal.py.
[project.scripts]
momwire-nec2c = "momwire.portal:main"
momwire-nec2c-shared = "momwire_nec2c_client:main"

[project.urls]
Homepage = "https://github.com/stevenmburns/momwire"
Issues = "https://github.com/stevenmburns/momwire/issues"

[tool.pytest.ini_options]
# Only collect the project's own tests.
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a couple seconds (deselect with -m 'not slow')",
    # Certification gates on memory residency/budget — tracemalloc peaks and
    # byte-budget arithmetic checked against a live allocation (issue #400).
    # These earn their keep on merge to main, not on every PR iteration or
    # local edit-test loop: `-m memgate` in ci.yml's push-to-main-only job,
    # `pytest -m memgate` locally. Disjoint from `slow` — a memgate test is
    # never also marked slow, so `-m "slow and not memgate"` (the CI
    # test-slow lane) and `-m memgate` partition cleanly.
    "memgate: residency/budget certification gates (tracemalloc, byte budgets) — run on merge-to-main CI and via -m memgate, not in the default run",
    # Tests that shell out to the NEC-2 oracle binary SimNEC ships
    # (nec2c-ubuntu-x86, under ~/.SimNEC/<major>/<minor>/Examples/). CI has no
    # such binary — that is exactly why tests/fixtures/nec_portal/ is
    # committed. The marked tests also carry a skipif keyed on the binary
    # actually existing (not on CI detection), so a developer who has SimNEC
    # installed runs them by default and everyone else skips cleanly.
    # Deselect explicitly with `-m "not oracle_binary"`.
    "oracle_binary: shells out to SimNEC's nec2c oracle; skipped when it is not installed",
]
# Default local run: skip the slow convergence ladders/oracle sweeps and the
# memgate certification gates, and run PARALLEL — `-n auto --dist loadgroup`
# is the default since #403 closed (maintainer decision 2026-08-19,
# reversing #400's serial default now that its premise — four
# order-sensitive portal failures — is fixed). Measured ~2m00s against the
# serial lane's 4m41-5m45s on 8 cores. tests/conftest.py pins OMP/OpenBLAS
# to 1 per worker automatically (nothing to export) and groups the
# portal/memgate files onto one worker; the default run is thereby also a
# continuous order fuzzer, and MOMWIRE_403_DUMP=<dir> captures any byte-
# oracle mismatch it ever surfaces.
#
# Escape hatches: `-n0` on the CLI turns xdist off (single-test loops,
# `--pdb`, precise `-x`); serial runs keep full threading, which is what
# the perf lanes were certified with. A CLI `-m` REPLACES the default `-m`
# rather than ANDing with it (verified: `pytest tests -m ""` runs
# everything, `pytest tests -m memgate` runs only memgate), so
# `pytest tests -m ""` is the full-suite spelling for humans, and CI lanes
# spell their own `-m` explicitly. The `-n` is NOT replaced by a CLI `-m`,
# so CI's test/test-slow lanes inherit the parallelism; the memgate lane
# opts out with an explicit `-n0` (memory certification cannot share a
# box), and the wheel-smoke jobs install pytest-xdist so the addopts parse.
addopts = ["-m", "not slow and not memgate", "-n", "auto", "--dist", "loadgroup"]
# Put the project root on sys.path so the `validation` harness package (which
# lives next to `tests/`, not under src/) is importable from the backend tests.
pythonpath = ["."]

[tool.cibuildwheel]
# Modern CPython only. requires-python is >=3.8, but 3.8/3.9 predate the
# AVX2-baseline target; 3.10+ matches the "modern Linux/Windows" goal.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# 64-bit glibc Linux + 64-bit Windows only. Skip musllinux (Alpine/musl has no
# libmvec, and the -lmvec link in setup.py would fail), 32-bit, and PyPy.
skip = "*-musllinux_* *_i686 *-win32 pp*"
test-requires = "pytest"
# First assert the compiled C++ accelerator actually loads in the wheel: a
# failed import would otherwise be swallowed by the solvers' pure-Python
# fallback, so the tests below would pass on a silently-degraded wheel. The
# direct import + _HAVE_* flags make that a hard failure instead.
#
# Then run only the three core solver modules — they exercise the accelerator
# without the PyNEC cross-check backend (a separately-built wheel, test-only).
# -m skips slow and memgate (#400: certification gates run on merge-to-main
# CI, not in a wheel smoke test). cibuildwheel runs this from a temp dir
# against the installed wheel, so `import momwire` resolves to the wheel, not
# src/.
test-command = 'python -c "import momwire._accelerators; from momwire import bspline as b; assert b._HAVE_BSPLINE_ASSEMBLE_ACCEL and b._HAVE_BSPLINE_SWEPT_ASSEMBLE_ACCEL" && pytest {project}/tests/test_momwire.py {project}/tests/test_hmatrix.py {project}/tests/test_array_block.py -m "not slow and not memgate"'

[tool.cibuildwheel.linux]
# glibc >= 2.28 ships libmvec; manylinux2014 (glibc 2.17) does NOT, so the
# -lmvec link in setup.py would fail. _2_28 is the right "modern Linux" floor.
# (It is also cibuildwheel 3.x+'s default, but pin it explicitly so a future
# default change can't silently drop libmvec.)
manylinux-x86_64-image = "manylinux_2_28"
# Do NOT vendor libgomp (`--exclude libgomp.so.1`): auditwheel would otherwise
# bundle a private copy (momwire.libs/libgomp-<hash>.so) that uses initial-exec
# TLS. When another OpenMP extension (e.g. pynec-accel) loads the system libgomp
# first, momwire's vendored copy then fails to dlopen with "cannot allocate
# memory in static TLS block" and the accelerator silently drops to the slow
# pure-Python path. Excluding it makes momwire link the SYSTEM libgomp, so both
# engines share one runtime — the Linux mirror of the macOS `--exclude libomp`,
# and matching what pynec-accel already does. Needs a system libgomp at runtime
# (the GCC OpenMP runtime, universal on glibc Linux; `apt install libgomp1` if
# absent — manylinux images already have it for the build).
repair-wheel-command = "auditwheel repair --exclude libgomp.so.1 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Native Apple Silicon only for this first cut (the macos-14 runner is arm64).
# Intel macOS (x86_64) is intentionally out of scope.
archs = ["arm64"]
# libomp is provided by `brew install libomp` — at build AND at runtime (the
# wheel no longer bundles it, see --exclude below). Point setup.py's darwin
# branch at it and pin the deployment target to the runner's floor.
environment = { LIBOMP_PREFIX = "/opt/homebrew/opt/libomp", MACOSX_DEPLOYMENT_TARGET = "14.0" }
# Do NOT vendor libomp (`--exclude libomp`): leave the extension referencing
# Homebrew's libomp by its absolute install-name
# (/opt/homebrew/opt/libomp/lib/libomp.dylib). pynec-accel's macOS wheel excludes
# it too, so when both load in one process they share ONE libomp image instead of
# each loading a private copy. Two private copies is what triggered the OMP
# "Error #15" duplicate-runtime abort + the join-barrier deadlock, forcing the
# KMP_DUPLICATE_LIB_OK / OMP_NUM_THREADS=1 stopgap; one shared runtime keeps both
# backends fully multithreaded with no env vars. This mirrors the Linux wheels,
# where neither side vendors libgomp (glibc's is shared) — macOS has no system
# libomp, so the shared copy is Homebrew's, hence `brew install libomp` is a
# runtime requirement of the macOS wheel. DYLD_LIBRARY_PATH lets delocate resolve
# the (now-external) libomp during repair.
repair-wheel-command = "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib delocate-wheel --exclude libomp --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.ruff.format]
# The chapter-figure scripts keep their hand-wrapped compact matplotlib style
# on purpose — the formatter would roughly double their line counts by
# exploding calls to one argument per line. Lint (ruff check) still covers
# them; only the FORMATTER skips them.
exclude = ["site/figures/*.py"]

[tool.ruff.lint]
ignore = ["E741"]
# Keep "imported but unused" as a warning instead of auto-stripping.
# Without this, multi-pass edits (add imports first, then add code that
# uses them) can have the import deleted between edits — by the editor's
# format-on-save, the project's auto-fix hook, or a pre-commit run —
# producing a broken next edit. Manual cleanup of unused imports is fine.
unfixable = ["F401"]
