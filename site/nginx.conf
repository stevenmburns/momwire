# Canonical host is momwire.dev (apex). The legacy subdomain and www both
# 301 there with the path preserved. Fly's proxy terminates TLS and (via
# force_https in fly.toml) upgrades plain http at the edge, so nginx only
# ever sees proxied traffic on port 80 and can redirect straight to https.
server {
    listen 80;
    listen [::]:80;
    server_name momwire.antennaknobs.dev www.momwire.dev;
    return 301 https://momwire.dev$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name momwire.dev;

    root /usr/share/nginx/html;
    index index.html;

    # Astro emits directory-style pages (/path/index.html). Resolve clean URLs
    # (with or without a trailing slash), then fall through to the static 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Fingerprinted build assets never change — cache them hard.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
