# The support hierarchy: the ORDER in which a change is certified, from the
# configuration most users run (1) to the one fewest do (8).
#
# Order only. No gates and no feature names live here: a feature's REACH (the
# deepest level it is certified at) is in `src/momwire/_features.py`, and a
# level's gates are the CI jobs it names. A feature of reach N is certified on
# levels 1..N; stable means reach == the deepest level.
#
# Each level lists the CI jobs that certify it as "<workflow file>:<job id>",
# from .github/workflows. A matrix job that spans platforms is listed under
# every level one of its cells certifies, with a comment saying which.
#
# `src/momwire/_features.py` carries the same ids and descriptions in the same
# order (an installed wheel reads no TOML, and the floor is Python 3.10, which
# has no tomllib); `tests/test_features_registry.py` holds the two equal.

[[level]]
id = "ak-linux-avx2"
description = "antennaknobs on Linux avx2: the hosted app"
jobs = [
    "ci.yml:test",  # the Linux default lane
    "ci.yml:test-slow",  # the slow lane
    "ci.yml:test-integration",
    "ci.yml:test-crossgate",
    "ci.yml:test-memgate",
    "ci.yml:test-pynec",
    "wheels.yml:linux_cross_engine",
]

[[level]]
id = "ak-windows"
description = "antennaknobs on Windows, avx2 and sse2"
jobs = [
    "wheels.yml:wheel_smoke",  # its windows-latest cells
    "wheels.yml:windows_cross_engine",
]

[[level]]
id = "portal-linux-windows"
description = "the drop-in portal on Linux and Windows, avx2 and sse2"
jobs = [
    "eznec-dropin.yml:freeze",  # standard (avx2) and win7 (sse2) bundles
    "eznec-dropin.yml:resident-smoke",
]

[[level]]
id = "macos"
description = "antennaknobs and the portal on macOS"
jobs = [
    "ci.yml:test-macos",
    "wheels.yml:wheel_smoke",  # its macos-15 cells
    "wheels.yml:macos_cross_engine",
]

[[level]]
id = "exe-bs2-razor-windows"
description = "the bspline_nec5 and razor2p executables on Windows, avx2 and sse2"
jobs = [
    "standalone.yml:windows",  # razor2p with its embedded-Python fallback
    "standalone.yml:windows-nopython",  # razor2p and bs2, avx2 and sse2
]

[[level]]
id = "exe-bs2-razor-linux-macos"
description = "the bspline_nec5 and razor2p executables on Linux and macOS"
jobs = [
    "standalone.yml:linux",
    "standalone.yml:macos-nopython",
]

[[level]]
id = "exe-bs42"
description = "the bspline_nec42 executable, all platforms"
jobs = [
    "standalone.yml:linux-nec42-bs",  # Linux only today
]

[[level]]
id = "exe-sin42"
description = "the sin42 executable, all platforms"
jobs = [
    "standalone.yml:linux-nec42",  # Linux only today
]

# Jobs that certify no level: change detectors, builds whose products the
# levels' own jobs test, release and publishing steps, and lanes whose subject
# is not a platform. The value says why each is here.
[unassigned]
"ci.yml:changes" = "path filter"
"ci.yml:lint" = "ruff; not a platform"
"eznec-dropin.yml:changes" = "path filter"
"eznec-dropin.yml:release" = "attaches the drop-in to a release"
"standalone.yml:linux-artifact" = "builds every Linux executable (all four bases); the exe levels' jobs test what it builds"
"standalone.yml:release-linux" = "attaches the Linux executables to a release"
"standalone.yml:release-windows" = "attaches the Windows executables to a release"
"standalone.yml:release-macos" = "attaches the macOS executables to a release"
"wheels.yml:changes" = "path filter"
"wheels.yml:build_wheels" = "builds the wheels on all three platforms; wheel_smoke tests them"
"wheels.yml:smoke_pythons" = "picks the Python versions wheel_smoke runs"
"wheels.yml:make_sdist" = "builds the sdist"
"wheels.yml:release" = "attaches wheels and sdist to a release"
"wheels.yml:publish-pypi" = "publishes to PyPI"
"nightly.yml:moved" = "decides whether main moved since the last nightly"
"nightly.yml:test-nightly" = "the full-sweep nightly; its place in the hierarchy is a later rollout step"
"simnec-driver.yml:pypi" = "the SimNEC driver from PyPI on three platforms; a host integration, not one level"
"simnec-driver.yml:checkout" = "the SimNEC driver from this checkout on macOS; a host integration"
"site.yml:build" = "the documentation site"
"deploy-docs.yml:deploy" = "deploys the documentation site"
